# Actualizaciones de dependencias, propuestas por GitHub en forma de solicitud.
#
# Existe junto a la puerta de `ci.yml`, y por la misma razón: durante el
# aprovisionamiento, el despliegue se bloqueó porque la imagen del sitio llevaba
# siete vulnerabilidades ALTAS en dependencias npm —`brace-expansion`,
# `ip-address`, `tar` y `undici`— que llevaban tiempo corregidas y que nadie
# había actualizado, porque nada lo estaba mirando.
#
# La puerta las detecta; esto las corrige. Detectarlas sin corregirlas convierte
# la puerta en un semáforo que siempre está en rojo, y un semáforo que siempre
# está en rojo se ignora.
#
# Los grupos reúnen lo que se revisa junto y separan lo que se revisa aparte:
# una actualización de la versión de Node no se revisa igual que un parche de una
# biblioteca de utilidades.
#
# Security updates: separados y urgentes (revisados diariamente).
# Patches: agrupados y auto-mergeables si pasan CI.
# Minor/Major: revisión manual.

# TODAS las entradas fijan `target-branch: develop`, y no es un detalle: sin esa
# línea Dependabot apunta a la rama por defecto (`main`) y las actualizaciones
# SALTAN el circuito. Todo lo demás entra por `develop`, se verifica en `staging` y
# sólo entonces llega a `main`; una subida de dependencia puede romper una
# construcción —lo hizo: `typescript@7` deja la instalación en rojo— así que tiene
# que recorrer el mismo camino que el resto, no aparecer directamente en `main`.

version: 2

# Configuración global de auto-merge: solo se permite en parches de seguridad
# y parches normales, NUNCA en minor/major (cambios breaking).
#
# Para que funcione, el repositorio debe tener "Allow auto-merge" habilitado
# en Settings → General → Pull Requests.
#
# Los PRs auto-mergeables requieren:
# - Tipo de actualización: patch o security
# - CI 7/7 PASS
# - Sin conflictos con la rama base
# - Aprobación de un CODEOWNER (si está configurado)

updates:
  # --- Dependencias de JavaScript ---------------------------------------------
  - package-ecosystem: npm
    target-branch: develop
    directory: /panel
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Los parches y las mejoras de versiones menores van juntos: revisarlos uno a
      # uno gasta más atención de la que merecen, y la atención es el recurso que
      # de verdad escasea en una revisión.
      menores:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [dependencias]
    # Ignorar actualizaciones que sabemos que rompen el build
    ignore:
      # Tailwind 4 está en plan de migración (ver ADR-0001)
      - dependency-name: "tailwindcss"
        update-types: [version-update:semver-major]
      # vue-router 5 es la rama actual
      - dependency-name: "vue-router"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    target-branch: develop
    directory: /sitio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [dependencias]
    ignore:
      - dependency-name: "tailwindcss"
        update-types: [version-update:semver-major]
      - dependency-name: "nuxt"
        update-types: [version-update:semver-major]

  # --- Dependencias de PHP -----------------------------------------------------
  - package-ecosystem: composer
    target-branch: develop
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [dependencias]

  # --- Imágenes base -----------------------------------------------------------
  #
  # Sin esto, la vigilancia de las imágenes base no existe: sus correcciones llegan
  # como versiones nuevas de paquete, y nadie se entera hasta que el escáner
  # bloquea una construcción. Así apareció `libexpat` 2.8.4-r0 con una
  # vulnerabilidad ALTA.
  - package-ecosystem: docker
    target-branch: develop
    directories:
      - /docker/app
      - /docker/nginx
      - /docker/sitio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencias]

  # --- Las propias acciones del flujo ------------------------------------------
  #
  # Aquí importa más que en ningún otro sitio: una acción fijada por confirmación
  # nunca se actualiza sola, que es justo lo que se quiere, pero también significa
  # que sin esto se queda atrás para siempre.
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencias]

  # --- GitHub Actions Security Updates ----------------------------------------
  #
  # Actualizaciones de seguridad de GitHub Actions se manejan por separado
  # porque se revisan diariamente y se mergean rápido (no esperan al ciclo
  # semanal).
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    labels: [seguridad]
    # Solo security updates
    open-security-pull-requests-limit: 5
