# Integración continua.
#
# La puerta que corre en cada cambio. Ninguna comprobación se salta y todas
# fallan el trabajo: una puerta que avisa pero no impide es decoración.
#
# Las acciones están fijadas por CONFIRMACIÓN y no por etiqueta: una etiqueta
# puede reapuntarse a otro código, y con ella cambia lo que se ejecuta en cada
# cambio sin que nadie toque este archivo.

name: Integración continua

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:

  # ---------------------------------------------------------------------------
  # El contrato es la fuente de verdad: si se rompe, lo demás no importa.
  # ---------------------------------------------------------------------------
  contrato:
    name: Contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Validar el contrato
        working-directory: panel
        run: |
          npm ci --ignore-scripts
          npx --yes @redocly/cli@2.55.0 lint ../contract/openapi.yaml

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: sede_pruebas
          POSTGRES_USER: sede
          POSTGRES_PASSWORD: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sede" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sede_pruebas
      DB_USERNAME: sede
      DB_PASSWORD: prueba
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, intl, zip, gd, bcmath, exif, pcntl
          coverage: none
      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar el entorno
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Formato
        working-directory: backend
        run: ./vendor/bin/pint --test
      - name: Análisis estático
        working-directory: backend
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Pruebas
        working-directory: backend
        run: php artisan test

  # ---------------------------------------------------------------------------
  # Panel
  # ---------------------------------------------------------------------------
  panel:
    name: Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Instalar
        working-directory: panel
        run: npm ci --ignore-scripts
      # ESLint (T-11, H-12). Falla ante cualquier error y si las advertencias superan
      # la línea base fijada en `panel/package.json` (`--max-warnings`).
      - name: Lint
        working-directory: panel
        run: npm run lint
      - name: Generar los tipos desde el contrato
        working-directory: panel
        run: npx openapi-typescript ../contract/openapi.yaml -o src/types/openapi.d.ts --read-write-markers
      - name: Comprobar tipos y compilar
        working-directory: panel
        run: npm run build

  # ---------------------------------------------------------------------------
  # Sitio
  # ---------------------------------------------------------------------------
  sitio:
    name: Sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sitio/package-lock.json
      - name: Instalar
        working-directory: sitio
        run: npm ci --ignore-scripts
      - name: Generar los tipos desde el contrato
        working-directory: sitio
        run: npx openapi-typescript ../contract/openapi.yaml -o types/openapi.d.ts --read-write-markers
      # `nuxt build` NO comprueba tipos: transpila y sigue. Sin este paso, un
      # error de tipos —un parámetro sin anotar, un `undefined` que se cuela—
      # llega a producción sin que nada lo diga. El panel ya lo comprobaba; el
      # sitio no lo hacía, y por eso se colaron dos.
      - name: Comprobar tipos
        working-directory: sitio
        run: npm run typecheck
      - name: Compilar
        working-directory: sitio
        run: npm run build

  # ---------------------------------------------------------------------------
  # Pila de contenedores
  # ---------------------------------------------------------------------------
  pila:
    name: Pila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: La pila se resuelve
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: prueba
          REDIS_PASSWORD: prueba
          BACKUP_PASSPHRASE: prueba
          S3_ACCESS_KEY: prueba
          S3_SECRET_KEY: prueba
        run: docker compose config --quiet
      - name: La pila exige los secretos de verdad
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          REDIS_PASSWORD: prueba
          BACKUP_PASSPHRASE: prueba
        run: |
          # Comprobación NEGATIVA. La puerta anterior demuestra que la pila se
          # resuelve cuando están los secretos, pero no que deje de resolverse
          # cuando faltan. Sin esto, borrar un ":?" de compose.yaml dejaría esta
          # puerta en verde y el fallo aparecería en un despliegue real.
          #
          # Aquí falta DB_PASSWORD a propósito.
          if docker compose config --quiet 2>/dev/null; then
            echo "La pila se resolvió SIN DB_PASSWORD: la exigencia no funciona."
            exit 1
          fi
          echo "Sin DB_PASSWORD la pila no se resuelve, como debe."
      - name: nginx atiende las rutas de autenticación
        run: |
          # `/sanctum/csrf-cookie` cayó durante meses en el comodín del sitio (404) y
          # la zona de límite del login apuntaba a una ruta que no existe. Ninguna
          # prueba lo notó porque nginx solo se ejercita desplegado. Esta guarda es
          # estática a propósito: comprueba que las dos rutas siguen declaradas y que
          # no vuelve la ruta inexistente. La prueba real es la de staging (AC-05.1).
          f=docker/nginx/conf.d/default.conf
          grep -Eq '^\s*location = /sanctum/csrf-cookie\s*\{' "$f" \
            || { echo "Falta 'location = /sanctum/csrf-cookie' en $f"; exit 1; }
          grep -Eq '^\s*location = /api/v1/panel/login\s*\{' "$f" \
            || { echo "Falta 'location = /api/v1/panel/login' (zona acceso) en $f"; exit 1; }
          if grep -Eq '^\s*location /api/v1/auth/' "$f"; then
            echo "Volvió la ruta inexistente /api/v1/auth/ (la zona acceso no limitaría el login)."
            exit 1
          fi
          echo "nginx declara /sanctum/csrf-cookie y /api/v1/panel/login."
      - name: El canal interno del sitio no se publica (ADR-0018)
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: prueba
          REDIS_PASSWORD: prueba
          BACKUP_PASSPHRASE: prueba
          S3_ACCESS_KEY: prueba
          S3_SECRET_KEY: prueba
        run: |
          # `conf.d/interno.conf` acepta `X-Sede-Cliente-Ip` de CUALQUIER origen
          # (`set_real_ip_from 0.0.0.0/0`) porque el puerto 8080 sólo es alcanzable
          # desde la red de Docker. Esa confianza vale lo que vale esta guarda: si
          # alguien publicara el 8080, cualquier visitante podría falsear su
          # dirección y saltarse los límites de peticiones sin que nada fallara.
          #
          # 1) Ningún servicio publica el 8080, ni en el puerto del anfitrión ni
          #    como destino. Se lee la pila ya resuelta, no el texto de compose.yaml,
          #    para que también la atrape una variable o un archivo de anulación.
          docker compose config --format json > /tmp/pila.json
          publicados=$(jq -r '[.services[] | (.ports // [])[] | select((.target|tostring)=="8080" or (.published|tostring)=="8080")] | length' /tmp/pila.json)
          if [ "$publicados" != "0" ]; then
            echo "Algún servicio publica el puerto 8080: el canal interno quedaría abierto a Internet."
            jq '[.services | to_entries[] | {servicio: .key, puertos: (.value.ports // [])} | select(.puertos | length > 0)]' /tmp/pila.json
            exit 1
          fi
          # 2) La pila sí publica el 80 y el 443 (si esto cambiara, la comprobación
          #    anterior podría estar mirando una pila vacía).
          jq -e '[.services.nginx.ports[].target] | sort == [80, 443]' /tmp/pila.json > /dev/null \
            || { echo "nginx ya no publica exactamente el 80 y el 443; revisar esta guarda."; exit 1; }
          # 3) La confianza amplia está en UN solo archivo.
          conf=docker/nginx
          donde=$(grep -rlE 'set_real_ip_from\s+(0\.0\.0\.0/0|::/0)' "$conf" || true)
          if [ "$donde" != "$conf/conf.d/interno.conf" ]; then
            echo "set_real_ip_from 0.0.0.0/0 debe existir sólo en conf.d/interno.conf; aparece en: ${donde:-ningún archivo}"
            exit 1
          fi
          # 4) El 8080 lo declara sólo ese archivo.
          escuchan=$(grep -rlE '^\s*listen\s+(\[::\]:)?(0\.0\.0\.0:)?8080\b' "$conf" || true)
          if [ "$escuchan" != "$conf/conf.d/interno.conf" ]; then
            echo "El puerto 8080 debe declararse sólo en conf.d/interno.conf; aparece en: ${escuchan:-ningún archivo}"
            exit 1
          fi
          # 5) El punto de entrada público borra la cabecera: si un visitante la
          #    manda en el 443, no debe llegar al sitio.
          grep -Eq '^\s*proxy_set_header\s+X-Sede-Cliente-Ip\s+"";' "$conf/conf.d/default.conf" \
            || { echo "default.conf ya no vacía X-Sede-Cliente-Ip en la ruta del sitio."; exit 1; }
          echo "El 8080 no se publica y la confianza en X-Sede-Cliente-Ip está acotada a interno.conf."
      - name: nginx emite la política de contenido en modo informe
        run: |
          # T-08 (H-09). El sitio y el panel emiten `Content-Security-Policy-Report-Only`.
          # Un `add_header` dentro de un `location` anula los del servidor, así que la
          # guarda comprueba que los dos bloques de documentos incluyen el snippet y que
          # la política no recupera `unsafe-eval` ni abre `unsafe-inline` en scripts.
          f=docker/nginx/conf.d/default.conf
          p=docker/nginx/snippets/csp-informe.conf
          [ "$(grep -c 'snippets/csp-informe.conf' "$f")" -ge 2 ] \
            || { echo "Faltan includes de csp-informe.conf en los locations del sitio y del panel."; exit 1; }
          grep -q '^add_header Content-Security-Policy-Report-Only ' "$p" \
            || { echo "El snippet ya no emite Content-Security-Policy-Report-Only."; exit 1; }
          linea="$(grep '^add_header Content-Security-Policy-Report-Only ' "$p")"
          for requerido in "default-src 'self'" "object-src 'none'" "base-uri 'self'" "frame-ancestors 'none'"; do
            echo "$linea" | grep -qF "$requerido" || { echo "Falta la directiva: $requerido"; exit 1; }
          done
          if echo "$linea" | grep -q "unsafe-eval"; then echo "La política contiene unsafe-eval."; exit 1; fi
          if echo "$linea" | grep -oE "script-src [^;]*" | grep -q "unsafe-inline"; then
            echo "script-src contiene unsafe-inline."; exit 1
          fi
          echo "CSP en modo informe: includes y directivas esenciales presentes."
      - name: nginx no registra lo que el ciudadano busca
        run: |
          # T-22 (AC-22.7, R3). La consulta del buscador viaja en la URL y puede traer
          # un documento de identidad. El registro de acceso debe llevar la ruta sin la
          # cadena de consulta cuando ésta trae `q` o `buscar`, en la línea de petición
          # y en el `Referer`. Guarda estática a propósito, como las anteriores: la
          # prueba real es leer el registro de staging (TC-BUS-23). Además de comprobar
          # que el formato usa las variables seguras, aplica las expresiones del propio
          # archivo a URL de ejemplo, de modo que una regex rota no pase por presente.
          python3 - <<'PY'
          import re, sys
          conf = open("docker/nginx/nginx.conf", encoding="utf-8").read()
          errores = []

          formato = re.search(r"log_format\s+principal\s+(.*?);", conf, re.S)
          if not formato:
              sys.exit("Falta log_format principal en docker/nginx/nginx.conf")
          formato = formato.group(1)
          if "$uri_registrable" not in formato:
              errores.append("log_format principal no usa $uri_registrable.")
          if "$referer_registrable" not in formato:
              errores.append("log_format principal no usa $referer_registrable.")
          if re.search(r"\$request\b(?!_)", formato):
              errores.append("log_format principal vuelve a usar $request (trae la cadena de consulta).")
          if "$request_uri" in formato:
              errores.append("log_format principal usa $request_uri sin filtrar.")
          if re.search(r"\$http_referer\b", formato):
              errores.append("log_format principal usa $http_referer sin filtrar.")

          def regla(variable):
              m = re.search(r"map\s+\$\w+\s+\$" + variable + r"\s*\{(.*?)\}", conf, re.S)
              if not m:
                  errores.append("Falta el map de $" + variable)
                  return None
              r = re.search(r"~(\S+)\s+\$(\w+);", m.group(1))
              if not r:
                  errores.append("El map de $" + variable + " no tiene su regla ~regex.")
                  return None
              # nginx escribe los grupos con nombre como (?<n>…); Python, como (?P<n>…).
              return re.compile(r.group(1).replace("(?<", "(?P<")), r.group(2)

          for variable, casos in (
              ("uri_registrable", [
                  ("/buscar?q=1234567890", "/buscar"),
                  ("/api/v1/busqueda/sugerencias?q=Juan%20Perez&limite=5", "/api/v1/busqueda/sugerencias"),
                  ("/api/v1/buscar?tipo=tramite&q=cedula", "/api/v1/buscar"),
                  ("//api/v1/buscar?q=doble", "//api/v1/buscar"),
                  ("/api/v1/tramites?buscar=predial&page=2", "/api/v1/tramites"),
              ]),
              ("referer_registrable", [
                  ("https://sede.example/buscar?q=1234567890", "https://sede.example/buscar"),
                  ("https://sede.example/tramites?buscar=predial", "https://sede.example/tramites"),
              ]),
          ):
              parte = regla(variable)
              if not parte:
                  continue
              rx, grupo = parte
              for entrada, esperado in casos:
                  m = rx.match(entrada)
                  if not m or m.group(grupo) != esperado:
                      errores.append(variable + ": '" + entrada + "' debía quedar como '" + esperado + "'.")
              for conservada in ("/api/v1/tramites?page=2&per_page=20", "/tramites?categoria=x&quest=1", "/buscar", "/api/v1/entidad"):
                  if rx.match(conservada):
                      errores.append(variable + ": '" + conservada + "' no debía recortarse.")

          # Informes de la política de contenido: su cuerpo trae la URL del documento.
          informe = re.search(r"log_format\s+csp_informe\s+(.*?);", conf, re.S)
          if not informe:
              errores.append("Falta log_format csp_informe.")
          else:
              if "$informe_registrable" not in informe.group(1):
                  errores.append("log_format csp_informe no usa $informe_registrable.")
              if "$request_body" in informe.group(1):
                  errores.append("log_format csp_informe vuelve a usar $request_body sin filtrar.")
          mapa = re.search(r"map\s+\$request_body\s+\$informe_registrable\s*\{(.*?)\}", conf, re.S)
          regla_informe = re.search(r"~\*(\S+)\s+\"", mapa.group(1)) if mapa else None
          if not regla_informe:
              errores.append("Falta el map de $informe_registrable con su regla ~*regex.")
          else:
              rx = re.compile(regla_informe.group(1), re.I)
              for cuerpo in (
                  '{"csp-report":{"document-uri":"https://s.example/buscar?q=123"}}',
                  '{"csp-report":{"document-uri":"https://s.example/tramites?page=2&buscar=Juan"}}',
                  '{"csp-report":{"document-uri":"https://s.example/t?x=1\\u0026q=secreto"}}',
              ):
                  if not rx.search(cuerpo):
                      errores.append("informe CSP con consulta no se omitiría: " + cuerpo)
              for cuerpo in (
                  '{"csp-report":{"document-uri":"https://s.example/tramites?page=2"}}',
                  '{"csp-report":{"blocked-uri":"https://cdn.example/a.js?quest=1"}}',
              ):
                  if rx.search(cuerpo):
                      errores.append("informe CSP sin consulta se omitiría de más: " + cuerpo)

          if errores:
              print("\n".join(errores))
              sys.exit(1)
          print("nginx omite la consulta del buscador en la petición, en el Referer y en los informes CSP.")
          PY

  # ---------------------------------------------------------------------------
  # Dependencias de terceros
  #
  # Esta puerta faltaba, y su ausencia explica por qué los fallos aparecían justo
  # al desplegar: ninguna comprobación miraba las dependencias, así que la primera
  # noticia de una vulnerabilidad publicada era la construcción bloqueada por el
  # escáner de la imagen. Averiguarlo entonces es tarde y caro: hay que entender
  # qué paquete es, de quién depende y actualizarlo con prisa.
  #
  # Aquí se revisan los ARCHIVOS DE BLOQUEO, sin instalar nada, así que corre en
  # segundos. Una vulnerabilidad corregible se ve al proponer el cambio, no al
  # intentar desplegarlo.
  # ---------------------------------------------------------------------------
  dependencias:
    name: Dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Auditoría del panel y del sitio
        run: |
          # Falla ante vulnerabilidades altas o críticas **corregibles**, que es lo
          # que declara el mensaje de esta puerta. La distinción vive en
          # `.github/scripts/auditar-dependencias.py`, porque `npm audit` sólo
          # devuelve un código de salida y no separa las que tienen arreglo de las
          # que no lo tienen aguas arriba.
          #
          # Una vulnerabilidad sin arreglo sólo se tolera si su advisory está
          # nombrado aquí con su identificador. La lista es explícita para que una
          # nueva no pueda colarse: si no está nombrada, rompe la construcción.
          #
          # GHSA-86w9-cpqp-85rv  node-forge RSA PKCS#1 via listhen → nuxt (dev)
          # GHSA-vfj7-8cjw-p6xm  braces DoS via chokidar → tailwindcss/vue-router.
          #   Tailwind CSS 3.x y vue-router 5.x bundlean chokidar 3.x, que depende
          #   de braces con la vulnerabilidad. No existe versión parcheada de esos
          #   paquetes que no rompa el build. El arreglo real es Tailwind CSS 4,
          #   que se evaluará en su momento.
          permitidas="GHSA-86w9-cpqp-85rv GHSA-vfj7-8cjw-p6xm"

          fallos=0
          for d in panel sitio; do
            echo "--- $d ---"
            (cd "$d" && npm audit --json > audit.json 2>/dev/null) || true

            lectura=$(python3 "$GITHUB_WORKSPACE/.github/scripts/auditar-dependencias.py" \
              "$d/audit.json" $permitidas)
            codigo=$?
            set -- $lectura
            toleradas=${2:-0}
            [ "$toleradas" -gt 0 ] && echo "    $toleradas tolerada(s): su advisory no tiene versión corregida"
            rm -f "$d/audit.json"

            [ "$codigo" -ne 0 ] && fallos=$((fallos + 1))
          done

          if [ "$fallos" -ne 0 ]; then
            echo "::error::Hay dependencias con vulnerabilidades altas o críticas corregibles."
            echo "Se arreglan actualizando el archivo de bloqueo, no bajando el umbral."
            exit 1
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Auditoría del backend
        working-directory: backend
        run: |
          # `--locked` es imprescindible y no es un detalle: sin él, Composer
          # busca los paquetes INSTALADOS y aquí no hay ninguno, así que responde
          # «No installed packages found» y falla. Con `--locked` audita el
          # archivo de bloqueo, que es lo que se quiere y además no necesita
          # instalar nada.
          if ! composer audit --locked --no-interaction; then
            echo "::error::Hay dependencias de PHP con vulnerabilidades conocidas."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Barrera contra credenciales
  #
  # La misma comprobación que corre antes de cada confirmación, aquí sobre todo
  # el contenido del cambio. Existe porque la exclusión por sí sola ya falló una
  # vez: un archivo con doce contraseñas llegó al índice.
  # ---------------------------------------------------------------------------
  credenciales:
    name: Credenciales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ningún archivo con credenciales
        run: |
          prohibidos='(^|/)(pass\.md|accesos\.local\.md|\.accesos\.local\.env|\.env)$|^\.claves/|\.(pem|p12|pfx|key)$'
          hallados=$(git ls-files | grep -E "$prohibidos" | grep -v '\.example$' || true)
          if [ -n "$hallados" ]; then
            echo "Archivos con credenciales versionados:"
            echo "$hallados"
            exit 1
          fi
          echo "Ninguno."
      - name: Ninguna credencial en el contenido ni en el historial
        run: |
          # Escaneo POR CONTENIDO de todos los commits de todas las ramas
          # (fetch-depth: 0), con las reglas por defecto de gitleaks más la lista
          # de excepciones revisada de `.gitleaks.toml`. Sustituye a dos pasos
          # anteriores que dejaban fuera los `.md` y que sólo avisaban sobre el
          # historial (H-05, T-06).
          #
          # Falla ante cualquier hallazgo no clasificado. Un hallazgo nuevo se
          # resuelve de una de dos maneras: rotando la credencial, o —si de verdad
          # no lo es— añadiendo una excepción con su motivo en `.gitleaks.toml`,
          # que se revisa en el PR. No se silencia el paso.
          #
          # Se compila desde el módulo de Go (preinstalado en el ejecutor), cuyo
          # resumen verifica sum.golang.org, en lugar de descargar un binario sin
          # comprobar.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.18.4
          "$RUNNER_TEMP/bin/gitleaks" detect --source . --config .gitleaks.toml \
            --log-opts="--all" --redact --no-banner --verbose

