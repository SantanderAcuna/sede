# Despliegue a DigitalOcean.
#
#   staging    ← rama staging
#   produccion ← rama main
#
# Cada entorno se enciende por separado con una variable del repositorio, de modo
# que uno pueda estar desplegando mientras el otro espera su dominio.
#
# El recorrido es: comprobar, construir, escanear, publicar y desplegar. Si algo
# falla, el servidor vuelve solo a la versión anterior.

name: Despliegue

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno a desplegar
        required: true
        type: choice
        options: [staging, produccion]

concurrency:
  # Un despliegue por entorno y de uno en uno: dos simultáneos sobre el mismo
  # servidor se pisan al migrar.
  group: despliegue-${{ github.ref_name }}
  cancel-in-progress: false

# Permisos mínimos arriba; `packages: write` se concede SÓLO al trabajo que
# publica imágenes. Concederlo a todos —incluidos los que despliegan— da capacidad
# de escritura en el registro a pasos que no la necesitan.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # IMAGEN_BASE no se declara aquí: el registro exige nombres en minúsculas y la
  # cuenta tiene mayúsculas. Se calcula en el primer paso de la construcción.

jobs:

  comprobar:
    name: Comprobar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: sede_pruebas
          POSTGRES_USER: sede
          POSTGRES_PASSWORD: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sede" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sede_pruebas
      DB_USERNAME: sede
      DB_PASSWORD: prueba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, gd, bcmath, exif, pcntl
          coverage: none
      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar el entorno
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Formato, análisis y pruebas
        working-directory: backend
        run: |
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          php artisan test

  # El panel va primero y en su propio trabajo, no como una entrada más de la
  # matriz, porque la imagen de nginx lo COPIA: necesita que exista y esté
  # publicada antes de empezar. En una matriz todos los trabajos corren a la vez,
  # así que no habría forma de garantizar el orden.
  panel:
    name: Construir el panel
    needs: [comprobar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calcular el nombre de la imagen
        run: |
          echo "IMAGEN_BASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Registro de contenedores
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar el constructor con caché
        run: docker buildx create --use --driver docker-container --name sede

      - name: Construir el panel
        run: |
          docker buildx build \
            --file docker/panel/Dockerfile \
            --tag ${{ env.REGISTRY }}/$IMAGEN_BASE-panel:${{ github.sha }} \
            --cache-from type=gha,scope=panel \
            --cache-to type=gha,scope=panel,mode=max \
            --load \
            .

      - name: Preparar el escáner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Escanear el panel
        run: |
          # La imagen del panel sólo contiene archivos, así que lo que se escanea
          # de verdad es su contenido: las dependencias que quedaron compiladas en
          # el artefacto. Aun así se escanea, porque «sólo son archivos» es
          # exactamente lo que se dice de casi todo lo que acaba publicado.
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress --format table \
            ${{ env.REGISTRY }}/$IMAGEN_BASE-panel:${{ github.sha }}

      - name: Publicar el panel
        run: docker push ${{ env.REGISTRY }}/$IMAGEN_BASE-panel:${{ github.sha }}

  construir:
    name: Construir y escanear
    needs: [comprobar, panel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    # Sin límite, un paso colgado consume el máximo del ejecutor: seis horas de
    # espera antes de que alguien se entere de que el despliegue no avanza.
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - nombre: app
            dockerfile: docker/app/Dockerfile
          - nombre: nginx
            dockerfile: docker/nginx/Dockerfile
          - nombre: sitio
            dockerfile: docker/sitio/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calcular el nombre de la imagen
        run: |
          # El registro de contenedores de GitHub exige el nombre en MINÚSCULAS,
          # y el de la cuenta tiene mayúsculas:
          #
          #   invalid tag "ghcr.io/SantanderAcuna/sede-nginx:...":
          #   repository name must be lowercase
          #
          # Una expresión del flujo no sabe convertir a minúsculas, así que se
          # calcula aquí y se publica para los pasos siguientes, que la leen como
          # variable de entorno de la orden.
          echo "IMAGEN_BASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "  imagen base: $(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

      - name: Registro de contenedores
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar el constructor con caché
        run: |
          # El constructor por defecto de buildx no admite la caché de GitHub
          # Actions, y sin caché CADA construcción recompila las extensiones de PHP
          # desde el código fuente: más de diez minutos por despliegue, en cada
          # empuje. Una construcción lenta no es sólo una molestia: es una que
          # falla por tiempo agotado, y un despliegue que no llega.
          docker buildx create --use --driver docker-container --name sede

      - name: Construir
        run: |
          # El punto de entrada COPIA el panel ya publicado, en lugar de
          # compilarlo: así el artefacto que se sirve es exactamente el que se
          # publicó, y no uno construido en paralelo que podría diferir.
          CONTEXTO=""
          if [ "${{ matrix.nombre }}" = "nginx" ]; then
            CONTEXTO="--build-context panel=docker-image://${{ env.REGISTRY }}/$IMAGEN_BASE-panel:${{ github.sha }}"
          fi

          docker buildx build \
            --file ${{ matrix.dockerfile }} \
            --tag ${{ env.REGISTRY }}/$IMAGEN_BASE-${{ matrix.nombre }}:${{ github.sha }} \
            --cache-from type=gha,scope=${{ matrix.nombre }} \
            --cache-to type=gha,scope=${{ matrix.nombre }},mode=max \
            $CONTEXTO \
            --load \
            .

      - name: Preparar el escáner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # La versión del escáner se fija para que el mismo código dé siempre el
          # mismo veredicto. Sin fijarla, una imagen que hoy pasa podría fallar
          # mañana porque cambió el catálogo de vulnerabilidades, y el fallo
          # parecería del código.
          version: v0.74.0

      - name: Escanear
        run: |
          # Se usa la orden de Trivy directamente, en lugar de `trivy-action`.
          # Aquella acción, fijada por confirmación en este archivo, referencia a
          # su vez OTRA acción por ETIQUETA (`aquasecurity/setup-trivy@v0.2.2`), y
          # esa versión ya no existe: la construcción fallaba al resolverla, sin
          # llegar a construir nada y cancelando las otras dos imágenes.
          #
          # Fijar por confirmación lo que uno escribe no basta si el salto
          # intermedio lo elige otro: una etiqueta puede reapuntarse a código
          # distinto sin que este archivo cambie. `setup-trivy` sí está fijada por
          # confirmación, y sus propias dependencias también, así que la cadena
          # entera queda determinada.
          #
          # Falla sólo con lo que ya se sabe cómo arreglar: no se publica una
          # imagen con una vulnerabilidad corregible.
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            --format table \
            ${{ env.REGISTRY }}/$IMAGEN_BASE-${{ matrix.nombre }}:${{ github.sha }}

      - name: Publicar
        run: docker push ${{ env.REGISTRY }}/$IMAGEN_BASE-${{ matrix.nombre }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Las etapas de despliegue se encienden por separado.
  # ---------------------------------------------------------------------------
  staging:
    name: Desplegar en pruebas
    needs: [construir]
    timeout-minutes: 20
    if: |
      (github.ref_name == 'staging' || inputs.entorno == 'staging')
      && vars.SEDE_DESPLIEGUE_STAGING == 'true'
    runs-on: ubuntu-latest
    # `SEDE_DOMINIO` es una variable del entorno, no del repositorio: el trabajo
    # `navegadores` la necesita y solo la puede recibir por aquí.
    outputs:
      dominio: ${{ vars.SEDE_DOMINIO }}
    environment:
      name: staging
      url: https://${{ vars.SEDE_DOMINIO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Desplegar
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USUARIO: ${{ secrets.DEPLOY_USER }}
          PUERTO: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # La llave del servidor está restringida a este único comando.
          # `BatchMode` hace que un fallo de autenticación falle ENSEGUIDA en vez de
          # quedarse esperando una contraseña que nadie va a teclear. Y
          # `StrictHostKeyChecking=yes` convierte en error explícito lo que hoy
          # depende del valor por defecto: el anfitrión tiene que estar en
          # `known_hosts` y coincidir, sin preguntar.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -p "$PUERTO" "$USUARIO@$HOST" \
            "desplegar.sh staging ${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # T-29 · La Sede, en más de un navegador (RNF-B1-033, RNF-B3-005; AC-29.1-29.3)
  #
  # Se ejecuta DESPUÉS de desplegar el entorno de pruebas y contra él, porque las
  # pruebas necesitan los datos reales de la API (rutas, trámites, políticas) que
  # el CI normal no tiene. No bloquea ni revierte nada: el despliegue ya ocurrió.
  # Un fallo aquí significa «hay una diferencia entre navegadores que mirar».
  #
  # Qué se ejecuta en cada motor:
  #   - `playwright test`  humo funcional, escritorio y teléfono (tests/e2e)
  #   - `tests/movil.mjs`  maquetación en teléfono, incluida la tabulación y los 44 px
  #   - `tests/kit-ui.mjs` componentes del Kit
  #   - `tests/diseno.mjs` conformidad de diseño (CAG-01 a CAG-34), con su propio servidor
  #
  # `webkit` es el motor de Safari, no Safari; `msedge` usa el canal de Edge del
  # ejecutor. Ninguno sustituye una prueba en un dispositivo real.
  #
  # PENDIENTE (AC-29.2, «resultado por navegador publicado como artefacto»): falta
  # subir los resultados como artefacto con `actions/upload-artifact` fijado por
  # hash, como el resto de acciones de este repositorio. Quien lo prepara no pudo
  # consultar el hash desde su entorno y no se inventa uno. Mientras tanto, el
  # resultado por navegador queda en el resumen de cada ejecución.
  # ---------------------------------------------------------------------------
  navegadores:
    name: Navegadores (${{ matrix.motor }})
    needs: [staging]
    if: ${{ !cancelled() && needs.staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        motor: [chromium, firefox, webkit, msedge]
    env:
      BASE_URL: https://${{ needs.staging.outputs.dominio }}
      NAVEGADOR: ${{ matrix.motor }}
      NUXT_PUBLIC_API_URL: https://${{ needs.staging.outputs.dominio }}/api/v1
      TIEMPO_ESPERA_MS: '30000'
    steps:
      # El dominio del entorno de pruebas no debe quedar escrito en los registros.
      - name: Enmascarar el dominio
        env:
          DOMINIO: ${{ needs.staging.outputs.dominio }}
        run: |
          if [ -z "$DOMINIO" ]; then echo "::error::El entorno de pruebas no devolvió su dominio."; exit 1; fi
          echo "::add-mask::$DOMINIO"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sitio/package-lock.json
      - name: Instalar
        working-directory: sitio
        run: npm ci --ignore-scripts
      # Sondeo: distingue «el entorno falla» de «el proxy frena al ejecutor». Solo
      # imprime estado y cabeceras de diagnóstico; el dominio va enmascarado.
      - name: Sondear el entorno desde el ejecutor
        run: |
          for ruta in / /politicas/uso-de-cookies /api/v1/politicas/uso-de-cookies; do
            cabeceras=$(curl -s -o /dev/null -D - -w 'tiempo: %{time_total}s\n' --max-time 30 "${BASE_URL}${ruta}" \
              | tr -d '\r' | grep -iE '^(HTTP/|server:|cf-mitigated:|retry-after:|tiempo:)' | tr '\n' ' ' || true)
            echo "${ruta} -> ${cabeceras}"
            case "$cabeceras" in *cf-mitigated*) echo "DESAFIADO=true" >> "$GITHUB_ENV" ;; esac
          done
      - name: Instalar el navegador
        working-directory: sitio
        run: |
          if [ "$NAVEGADOR" = "msedge" ]; then
            npx playwright install msedge
          else
            npx playwright install --with-deps "$NAVEGADOR"
          fi
      - name: Compilar (la prueba de diseño arranca su propio servidor)
        working-directory: sitio
        run: |
          npx openapi-typescript ../contract/openapi.yaml -o types/openapi.d.ts --read-write-markers
          npm run build
      - name: Pruebas en ${{ matrix.motor }}
        working-directory: sitio
        run: |
          set +e
          fallos=0
          DESAFIADO="${DESAFIADO:-false}"
          {
            echo "### ${NAVEGADOR}"
            echo
            echo "| Prueba | Resultado |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          correr() {
            nombre="$1"; shift
            "$@"
            codigo=$?
            if [ "$codigo" -eq 0 ]; then
              resultado="✅ pasa"
            elif [ "$DESAFIADO" = "true" ] && [ "$nombre" != "humo funcional (escritorio y teléfono)" ]; then
              # Esta prueba hace peticiones fuera del navegador (curl, fetch del servidor) y
              # Cloudflare las desafía desde las IP de GitHub: el fallo no dice nada del sitio.
              resultado="⚠️ no concluyente: Cloudflare desafía al ejecutor (código $codigo)"
            else
              resultado="❌ falla (código $codigo)"; fallos=$((fallos + 1))
            fi
            echo "| ${nombre} | ${resultado} |" >> "$GITHUB_STEP_SUMMARY"
          }
          proyectos="--project=${NAVEGADOR} --project=${NAVEGADOR}-movil"
          correr "humo funcional (escritorio y teléfono)" npx playwright test $proyectos
          correr "maquetación en teléfono" node tests/movil.mjs
          correr "componentes del Kit" node tests/kit-ui.mjs
          correr "conformidad de diseño (CAG)" node tests/diseno.mjs
          # El resumen del paso se guarda como archivo para poder descargarlo (AC-29.2).
          cp "$GITHUB_STEP_SUMMARY" "resumen-${NAVEGADOR}.md"
          exit "$fallos"
      # Evidencia descargable por motor. **No se suben las trazas** (`test-results/`):
      # llevan el dominio del entorno de pruebas dentro y el enmascarado sólo actúa en
      # los registros, no en los artefactos. El JSON se limpia del dominio antes de subir.
      - name: Preparar la evidencia
        if: ${{ always() }}
        working-directory: sitio
        env:
          DOMINIO: ${{ needs.staging.outputs.dominio }}
        run: |
          for f in resultados-navegadores.json "resumen-${NAVEGADOR}.md"; do
            [ -f "$f" ] && sed -i "s#${DOMINIO}#<dominio>#g" "$f"
          done
          true
      - name: Subir la evidencia
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navegadores-${{ matrix.motor }}
          path: |
            sitio/resultados-navegadores.json
            sitio/resumen-${{ matrix.motor }}.md
          if-no-files-found: warn
          retention-days: 14

  produccion:
    name: Desplegar en producción
    needs: [construir]
    timeout-minutes: 20
    if: |
      (github.ref_name == 'main' || inputs.entorno == 'produccion')
      && vars.SEDE_DESPLIEGUE_PRODUCCION == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SEDE_DOMINIO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Desplegar
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USUARIO: ${{ secrets.DEPLOY_USER }}
          PUERTO: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -p "$PUERTO" "$USUARIO@$HOST" \
            "desplegar.sh produccion ${{ github.sha }}"
