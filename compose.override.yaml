# Sólo para desarrollo. NO se usa en producción y el despliegue no lo lee.
#
# Lo que hace: exponer la pila en el anfitrión para poder trabajar, montar el
# código para que los cambios se vean sin reconstruir, y añadir un servidor de
# correo de mentira para no enviar nada real desde una máquina de desarrollo.

services:

  nginx:
    # La imagen de nginx recibe el panel como contexto con nombre (ver su Dockerfile). En
    # local es la imagen `sede-panel:dev` que construye `scripts/local.sh` antes de levantar.
    build:
      additional_contexts:
        panel: docker-image://sede-panel:dev
    # Se remapan los puertos porque el 80 y el 443 del anfitrión pueden estar
    # ocupados. Los puertos INTERNOS de los contenedores no cambian.
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # La SPA servida desde disco, montada en vivo.
      - ./panel/dist:/usr/share/nginx/panel:ro,z

  app:
    build:
      target: final
    read_only: false
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # En desarrollo no se cachean la configuración ni las rutas: se quiere ver el efecto de
      # cada cambio. Ver docker/app/entrypoint.sh.
      SEDE_CACHE_MARCO: "0"

  # La red `data` es interna (compose.yaml): Docker NO publica puertos de un contenedor que
  # solo está en redes internas (medido con Docker 29.9.3: `PortBindings` declarado y `Ports`
  # nulo). Para que `ports` funcione en desarrollo, la base y Redis se unen además a `local`,
  # una red NO interna que solo existe aquí. Producción no lee este archivo.
  postgres:
    networks: [data, local]
    ports:
      - "${POSTGRES_PUERTO_LOCAL:-5432}:5432"

  redis:
    networks: [data, local]
    ports:
      - "${REDIS_PUERTO_LOCAL:-6379}:6379"

  # Las colas y el programador no arrancan por defecto en desarrollo: se
  # levantan sólo cuando se trabaja con ellas.
  horizon:
    profiles: ["colas"]
    environment:
      SEDE_CACHE_MARCO: "0"

  scheduler:
    profiles: ["colas"]
    environment:
      SEDE_CACHE_MARCO: "0"

  # Correo de mentira. Todo lo que la sede envíe se puede leer aquí y no sale
  # de la máquina.
  correo:
    # Fijada por versión **y** por resumen: `latest` es una etiqueta móvil y este
    # contenedor recibe el correo de la sede, aunque sea de mentira. Cambiar de
    # versión es un cambio deliberado, no un efecto de volver a levantar el entorno
    # (lo comprueba `make imagenes`).
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    networks: [backend]
    ports:
      - "1025:1025"
      - "8025:8025"

networks:
  # Solo desarrollo: da salida a los puertos publicados de postgres y redis (ver arriba).
  local:
    name: ${APP_NAME:-sede}-local
