# Pila de producción de la Sede Electrónica.
#
# Tres reglas gobiernan este archivo:
#
#   1. Sólo el punto de entrada publica puertos. Ni la base, ni la caché, ni la
#      aplicación, ni el servidor del sitio. El aislamiento no depende de dónde
#      escucha un proceso, sino de que no exista un mapeo de puerto.
#   2. Todo contenedor corre sin privilegios, con el sistema de archivos de sólo
#      lectura y sin capacidades.
#   3. Los secretos son obligatorios y se declaran con `:?`: sin ellos la pila no
#      se resuelve, en lugar de arrancar a medias con un valor inventado.
#
# Dimensionado para un servidor de 8 GB. Comparte con el sistema anfitrión,
# así que los límites suman menos que la memoria total: es lo que evita que un
# contenedor desbocado se lleve por delante a los demás.

name: sede

x-comun-app: &comun-app
  image: ${REGISTRY:-sede}/${APP_NAME:-sede}-app:${APP_VERSION:-dev}
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  restart: unless-stopped
  # La clave de la aplicación se exige aquí, junto a los demás secretos. Sin ella
  # el contenedor arrancaría y fallaría en el primer cifrado, en lugar de no
  # arrancar: un fallo tardío y sin nombre se descubre en producción.
  environment:
    APP_KEY: ${APP_KEY:?La clave de la aplicación es obligatoria}
    # La aplicación NO usa al dueño de la base (Fase 0A, D-0.1): `DB_USERNAME`/`DB_PASSWORD`
    # del `.env` son del dueño y aquí se SUSTITUYEN por el rol de DML. Así el entorno del
    # contenedor nunca lleva la clave del dueño. `environment` gana sobre `env_file`.
    DB_USERNAME: ${DB_APP_USERNAME:-sede_app}
    DB_PASSWORD: ${DB_APP_PASSWORD:?La clave del rol de la aplicación (DB_APP_PASSWORD) es obligatoria}
    # Genera las cachés de configuración, rutas y eventos de Laravel al arrancar, en el /tmp
    # (tmpfs) de ESTE contenedor. Solo `app` hereda este bloque; horizon y scheduler lo repiten
    # más abajo porque su `environment` reemplaza el del ancla. Ver docker/app/entrypoint.sh.
    SEDE_CACHE_MARCO: "1"
  env_file:
    # El archivo se deja OPCIONAL a propósito. Los valores también pueden llegar
    # por el entorno del proceso, que es como los inyecta la canalización. Exigir
    # el archivo obligaba a que existiera .env aunque no hiciera falta, y por eso
    # `docker compose config` fallaba en la canalización. Los secretos críticos
    # siguen exigidos uno a uno con ":?" en cada servicio: un despliegue sin
    # valores sigue fallando, y con un mensaje que dice cuál falta.
    - path: .env
      required: false
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [backend, data]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /run:size=8m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  # `/app/bootstrap/cache` NO se monta: sus manifiestos (`packages.php`, `services.php`) los
  # genera la imagen al construirse y deben ser los de ESA versión. Un volumen con nombre ahí
  # conservaba los de la versión que lo creó (deploy/pruebas/guarda-bootstrap-cache.sh).
  volumes:
    - almacenamiento-app:/app/storage

services:

  # ---------------------------------------------------------------------------
  # Punto de entrada. El único que publica puertos.
  # ---------------------------------------------------------------------------
  nginx:
    image: ${REGISTRY:-sede}/${APP_NAME:-sede}-nginx:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      app:   { condition: service_healthy }
      sitio: { condition: service_healthy }
    networks: [edge, backend]
    environment:
      # CSP: «informe» (no bloquea) por defecto; «aplicar» solo por decisión humana (AC-08.3).
      SEDE_CSP_MODO: ${SEDE_CSP_MODO:-informe}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # Los certificados se montan en sólo lectura: el contenedor no debe poder
      # modificarlos ni ver la clave de la autoridad.
      - ${SEDE_CERTS_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro,z
      - certbot-webroot:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    # La memoria de un servidor web es pequeña: no acumula estado.
    mem_limit: 256m
    pids_limit: 256

  # ---------------------------------------------------------------------------
  # Aplicación: PHP-FPM. No publica nada; nginx le habla por la red interna.
  # ---------------------------------------------------------------------------
  app:
    <<: *comun-app
    mem_limit: 1.5g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/health REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Colas. La misma imagen, otro proceso.
  # ---------------------------------------------------------------------------
  horizon:
    <<: *comun-app
    command: ["php", "artisan", "horizon"]
    # `environment` en un servicio que hereda por `<<` reemplaza el del ancla: se repiten sus tres
    # variables y se añaden los límites de procesos largos (0D, D7).
    environment:
      APP_KEY: ${APP_KEY:?La clave de la aplicación es obligatoria}
      DB_USERNAME: ${DB_APP_USERNAME:-sede_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:?La clave del rol de la aplicación (DB_APP_PASSWORD) es obligatoria}
      # Límites de tiempo de los procesos largos (0D, D7). La web usa los del rol `sede_app`
      # (estrictos); estos son mayores porque el borrado diario de consentimientos crece con el
      # tráfico. Un valor por omisión de rol no es un techo: `PGOPTIONS` lo sube para ESTE proceso.
      # Mismos valores que fija `LimitesPorRolTest`; `docs/limites-por-rol-bd.md` da las razones.
      # Cachés de Laravel al arrancar (docker/app/entrypoint.sh); ver el ancla `comun-app`.
      SEDE_CACHE_MARCO: "1"
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Tareas programadas. Una sola instancia: dos programadores ejecutarían cada
  # tarea dos veces.
  # ---------------------------------------------------------------------------
  scheduler:
    <<: *comun-app
    command: ["php", "artisan", "schedule:work"]
    # La copia nocturna se hace con el rol de SÓLO LECTURA (conexión `pgsql_copia`).
    environment:
      APP_KEY: ${APP_KEY:?La clave de la aplicación es obligatoria}
      DB_USERNAME: ${DB_APP_USERNAME:-sede_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:?La clave del rol de la aplicación (DB_APP_PASSWORD) es obligatoria}
      DB_COPIA_USERNAME: ${DB_LECTURA_USERNAME:-sede_lectura}
      DB_COPIA_PASSWORD: ${DB_LECTURA_PASSWORD:?La clave del rol de lectura (DB_LECTURA_PASSWORD) es obligatoria}
      # Límites de tiempo de los procesos largos (0D, D7). La web usa los del rol `sede_app`
      # (estrictos); estos son mayores porque el borrado diario de consentimientos crece con el
      # tráfico. Un valor por omisión de rol no es un techo: `PGOPTIONS` lo sube para ESTE proceso.
      # Mismos valores que fija `LimitesPorRolTest`; `docs/limites-por-rol-bd.md` da las razones.
      # Cachés de Laravel al arrancar (docker/app/entrypoint.sh); ver el ancla `comun-app`.
      SEDE_CACHE_MARCO: "1"
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"
    mem_limit: 256m
    pids_limit: 128
    # Además de lo común, monta las copias de seguridad: ESTE es el proceso que
    # ejecuta `backup:run` cada noche (backend/routes/console.php). `volumes` en un
    # servicio que hereda por `<<` REEMPLAZA la lista, no la amplía; por eso se
    # repite el montaje de siempre. Los demás servicios NO montan `/copias`:
    # lo que no necesita escribir las copias no debe poder alcanzarlas.
    volumes:
      - almacenamiento-app:/app/storage
      - copias:/copias
    # La sonda se DESACTIVA, y no es un descuido: sin declararla, este servicio
    # hereda la de la IMAGEN, que habla FastCGI contra PHP-FPM —un proceso que
    # aquí no existe—, así que quedaba permanentemente «enfermo».
    #
    # Un servicio eternamente enfermo que además funciona es peor que uno
    # caído: enseña a ignorar el aviso, y el día que algo esté de verdad mal
    # nadie lo mirará. Aquí el proceso es único y en primer plano, así que su
    # vida ES la señal de salud: si se cae, Docker lo reinicia.
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Sitio público, con renderizado en servidor.
  # ---------------------------------------------------------------------------
  sitio:
    image: ${REGISTRY:-sede}/${APP_NAME:-sede}-sitio:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/sitio/Dockerfile
    restart: unless-stopped
    # El sitio NO carga el `.env`. Antes lo cargaba entero y el contenedor que renderiza y
    # reenvía contenido de terceros recibía la clave de la aplicación, la del dueño de la base,
    # la frase de las copias y `REDIS_PASSWORD`. Con acceso a Redis (T9.5) eso anulaba el usuario
    # ACL: bastaba leer `REDIS_PASSWORD` del propio entorno para entrar como `default`. Ahora
    # recibe SÓLO lo que usa; `deploy/pruebas/guarda-cache-sitio.sh` falla si aparece algo más.
    #
    # Nuxt sólo acepta en ejecución las variables con prefijo `NUXT_` (ruta del ajuste en
    # mayúsculas). La dirección de Redis no es configurable por entorno a propósito: es la de la
    # red `cache-sitio`, que declara este mismo archivo.
    environment:
      NUXT_API_INTERNA: ${NUXT_API_INTERNA:-http://nginx:8080}
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-/api/v1}
      # Las copias sólo se guardan para el dominio de la sede (H34). `public.dominio` se hornea al
      # CONSTRUIR la imagen; este valor lo corrige al ARRANCAR con el del despliegue (la plantilla
      # lo entrega como `SEDE_DOMINIO`).
      NUXT_PUBLIC_DOMINIO: ${SEDE_DOMINIO:-localhost}
      NUXT_REDIS_HOST: redis
      NUXT_REDIS_PORT: "6379"
      NUXT_REDIS_USUARIO: sitio
      NUXT_REDIS_PASSWORD: ${REDIS_SITIO_PASSWORD:?La contraseña del usuario ACL «sitio» de Redis es obligatoria}
    depends_on:
      app: { condition: service_healthy }
    # Sin `depends_on: redis`: el respaldo falla ABIERTO (ADR-0018). Si Redis no estuviera sano,
    # el sitio tiene que arrancar igual, sin copia, y no quedar caído por la caché.
    networks: [backend, cache-sitio]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    # La salud del sitio NO puede depender de la API (ADR-0018).
    #
    # Antes pedía `/`, que renderiza la portada y por tanto consulta la API a través
    # de nginx. Pero nginx espera a que el sitio esté sano (`depends_on` de arriba), y
    # Compose recrea nginx ANTES de arrancar el sitio: durante el arranque, la API
    # interna (`nginx:8080`) no existe, la conexión se queda colgada, la comprobación
    # se agota a los 5 s, el sitio queda «unhealthy» y nginx no arranca nunca. Se vio
    # en staging: 521 en todo el dominio tras el primer despliegue con el canal interno.
    #
    # `/robots.txt` lo responde el propio proceso de Node con su configuración, sin
    # tocar la API. Prueba que el servidor atiende; que las páginas se rendericen bien
    # lo comprueban las pruebas de navegador del despliegue. `-m 4` acota la espera
    # por debajo del `timeout` para que un cuelgue se vea como fallo y no como agotado.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 4 http://127.0.0.1:3000/robots.txt > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Base de datos. Sólo en la red de datos, que no es alcanzable desde fuera de
  # la pila.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Los ajustes se pasan como parámetros EXPLÍCITOS, no en un archivo aparte.
    # PostgreSQL no acepta `include_dir` por línea de órdenes —es una directiva
    # del archivo de configuración, no un parámetro—, así que la alternativa era
    # un `config_file` completo o un guion de inicialización que sólo corre la
    # primera vez. Explícitos aquí se aplican SIEMPRE y se ven al leer el archivo,
    # que es justo lo que no pasaba antes: los ajustes vivían en un archivo que la
    # imagen oficial NUNCA leía, y parecían aplicados.
    #
    # Dimensionados al límite del contenedor (2 GB) y no a la memoria del
    # servidor: un `shared_buffers` calculado sobre la memoria total es la forma
    # clásica de que la base se coma la máquina.
    command:
      - postgres
      - -c
      - "shared_buffers=512MB"
      - -c
      - "effective_cache_size=1536MB"
      - -c
      - "work_mem=8MB"
      - -c
      - "maintenance_work_mem=128MB"
      - -c
      - "max_connections=100"
      - -c
      - "log_min_duration_statement=1000"
      - -c
      - "log_connections=on"
      - -c
      - "log_disconnections=on"
      - -c
      - "log_line_prefix='%m [%p] %u@%d '"
      - -c
      - "log_checkpoints=on"
      - -c
      - "log_lock_waits=on"
    # `ssl` lo decide el guion según POSTGRES_SSL (por defecto, apagado).
    # Con `sh` explícito: los `configs` de Compose no garantizan el bit de ejecución fuera de Swarm
    # (el aviso de `mode` lo dice), y esto no debe depender de la versión de Compose del servidor.
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-tls.sh"]
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_SSL: ${POSTGRES_SSL:-off}
      POSTGRES_DB: ${DB_DATABASE:-sede}
      POSTGRES_USER: ${DB_USERNAME:-sede}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?La contraseña de la base es obligatoria}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # PostgreSQL 18 cambió la convención: espera UN montaje en
      # /var/lib/postgresql y coloca los datos en un subdirectorio por versión,
      # para que `pg_upgrade --link` no tropiece con el límite del montaje.
      # Montándolo donde se montaba antes, la imagen encuentra «unused
      # mount/volume» y SE NIEGA A ARRANCAR: el mensaje lo explica, pero hay que
      # leerlo entero para ver que no es un problema de datos.
      - datos-postgres:/var/lib/postgresql
      - ${SEDE_DB_CERTS_DIR:-./docker/postgres/certs}:/tls:ro,z
    # El punto de entrada viaja DENTRO de este archivo (configs.entrypoint_tls, abajo). Un montaje
    # `./docker/postgres/entrypoint-tls.sh` apuntaba a un archivo que el servidor no tiene —al
    # servidor sólo llegan compose.yaml, plantilla.env y valores-<entorno>.env—, Docker creaba
    # un DIRECTORIO y el contenedor moría con «is a directory». Ver
    # deploy/pruebas/guarda-montajes-compose.sh.
    configs:
      - source: entrypoint_tls
        target: /usr/local/bin/entrypoint-tls.sh
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # FOWNER hace falta además de CHOWN: el punto de entrada AJUSTA
    # permisos de archivos que ya existen, y sin esa capacidad avisa de
    # «chmod: Operation not permitted» en cada arranque.
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sede} -d ${DB_DATABASE:-sede}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Caché, sesiones y colas.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    networks: [data, cache-sitio]
    # La política de expulsión NO es `allkeys-lru`: expulsaría también las claves SIN tiempo de
    # vida, como las listas de las colas, que no se pueden reconstruir. Con `volatile-lru` sólo se
    # expulsa lo que tiene tiempo de vida, y eso NO es sólo la caché: las sesiones de Laravel se
    # guardan con él (`SESSION_LIFETIME`, 120 min: `CacheBasedSessionHandler::write` usa
    # `put(…, minutos * 60)`) y las copias del respaldo del sitio también (`EX`). Bajo presión de
    # memoria, Redis puede expulsar una sesión (el usuario vuelve a iniciar sesión) antes que una
    # cola. Las claves del sitio (`sitio:*`) comparten esta memoria. Medido en T9.6 con el catálogo de
    # staging (123 trámites): lo que las páginas pueden guardar son 342 claves y 2,3 MiB (0,5 % de
    # `maxmemory`); lo máximo que admite la lista blanca, 1.946 claves y 28,1 MiB (6,3 %). Crece con
    # el tamaño del catálogo: ver «Medición (T9.6)» en docs/adr/0009-….md.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?La contraseña de la caché es obligatoria}
      # Usuario del respaldo del sitio (T9.5, ADR-0009): sólo lee, escribe y borra claves
      # `sitio:*`, y hace PING. Sin `+@all`, `-@all` deja fuera `FLUSHALL`, `KEYS`, `CONFIG`,
      # `EVAL`... y `~sitio:*` lo deja sin ver las sesiones ni las colas de la aplicación.
      # Su contraseña es OTRA: la principal no sale del servidor ni llega al sitio.
      - --user
      - sitio
      - "on"
      - ">${REDIS_SITIO_PASSWORD:?La contraseña del usuario ACL «sitio» de Redis es obligatoria}"
      - "~sitio:*"
      - "-@all"
      - "+get"
      - "+set"
      - "+del"
      - "+ping"
      - "+auth"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 448mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - "900 1"
    volumes:
      - datos-redis:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # La contraseña se interpola AL CONFIGURAR, no dentro del contenedor: el
      # servicio no declara `REDIS_PASSWORD` en su entorno, así que
      # `$${REDIS_PASSWORD}` quedaba VACÍO, `redis-cli ping` respondía NOAUTH y la
      # sonda no podía pasar NUNCA. Un servicio permanentemente «enfermo» que
      # además funciona es peor que uno caído: nadie mira el aviso.
      test: ["CMD-SHELL", "REDISCLI_AUTH='${REDIS_PASSWORD:?La contraseña de la caché es obligatoria}' redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Copias de seguridad MANUALES. Efímero: se levanta, copia y se va. No tiene
  # puertos ni sonda porque no atiende peticiones.
  #
  # Se usa así: `docker compose --profile copias run --rm copia`, por ejemplo justo
  # antes de una migración delicada. La copia NOCTURNA no sale de aquí sino del
  # servicio `scheduler`, que es el que lleva la agenda.
  # ---------------------------------------------------------------------------
  copia:
    <<: *comun-app
    profiles: ["copias"]
    command: ["php", "artisan", "backup:run"]
    # `environment` en un servicio que hereda por `<<` reemplaza el del ancla: sin
    # repetir APP_KEY aquí, este servicio la perdía.
    environment:
      APP_KEY: ${APP_KEY:?La clave de la aplicación es obligatoria}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?La frase de paso de las copias es obligatoria}
      DB_USERNAME: ${DB_APP_USERNAME:-sede_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:?La clave del rol de la aplicación (DB_APP_PASSWORD) es obligatoria}
      DB_COPIA_USERNAME: ${DB_LECTURA_USERNAME:-sede_lectura}
      DB_COPIA_PASSWORD: ${DB_LECTURA_PASSWORD:?La clave del rol de lectura (DB_LECTURA_PASSWORD) es obligatoria}
      # Límites de tiempo de los procesos largos (0D, D7). La web usa los del rol `sede_app`
      # (estrictos); estos son mayores porque el borrado diario de consentimientos crece con el
      # tráfico. Un valor por omisión de rol no es un techo: `PGOPTIONS` lo sube para ESTE proceso.
      # Mismos valores que fija `LimitesPorRolTest`; `docs/limites-por-rol-bd.md` da las razones.
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"
    volumes:
      - almacenamiento-app:/app/storage
      - copias:/copias
    restart: "no"

  # ---------------------------------------------------------------------------
  # Migraciones, con el rol DUEÑO (Fase 0A, D-0.1). Es el ÚNICO servicio que lleva la
  # clave del dueño. `docker compose --profile migrar run --rm migrar`. Crea o
  # actualiza además los roles `sede_app` y `sede_lectura` (migración de roles).
  # ---------------------------------------------------------------------------
  migrar:
    <<: *comun-app
    profiles: ["migrar"]
    command: ["sh", "-c", "php artisan migrate --database=pgsql_migracion --force && php artisan bd:sincronizar-roles --database=pgsql_migracion"]
    environment:
      APP_KEY: ${APP_KEY:?La clave de la aplicación es obligatoria}
      DB_MIGRATION_USERNAME: ${DB_USERNAME:-sede}
      DB_MIGRATION_PASSWORD: ${DB_PASSWORD:?La clave del dueño de la base es obligatoria}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?La clave del rol de la aplicación (DB_APP_PASSWORD) es obligatoria}
      DB_LECTURA_PASSWORD: ${DB_LECTURA_PASSWORD:?La clave del rol de lectura (DB_LECTURA_PASSWORD) es obligatoria}
    restart: "no"

configs:
  # Copia EXACTA de docker/postgres/entrypoint-tls.sh (cada `$` escrito `$$`, que en Compose
  # es un `$` literal). La fuente legible es el archivo; la guarda
  # deploy/pruebas/guarda-montajes-compose.sh comprueba que ambos sean idénticos.
  entrypoint_tls:
    content: |
      #!/bin/sh
      #
      # Arranque de PostgreSQL con TLS opcional (Fase 0A, T5).
      #
      #   POSTGRES_SSL=off (por defecto)  no se activa TLS.
      #   POSTGRES_SSL=on                 exige /tls/server.crt y /tls/server.key, activa TLS y
      #                                   RECHAZA las conexiones de red sin TLS (hostnossl reject).
      #
      # Por qué un guion y no `-c ssl_key_file=/tls/server.key` directo: PostgreSQL rechaza una
      # clave que no sea del usuario `postgres` (o de root con permisos <= 0640 y grupo
      # adecuado), y un montaje de sólo lectura desde el anfitrión llega con otro dueño. Se
      # copia a un sitio propio con el dueño y los permisos que exige.
      #
      # Si se pide TLS y faltan los archivos, el contenedor NO arranca: una base que se creía
      # cifrada y no lo está es peor que una que no arranca.
      set -eu

      if [ "$${POSTGRES_SSL:-off}" = "on" ]; then
        if [ ! -s /tls/server.crt ] || [ ! -s /tls/server.key ]; then
          echo "POSTGRES_SSL=on pero faltan /tls/server.crt o /tls/server.key." >&2
          exit 1
        fi
        install -d -m 700 -o postgres -g postgres /var/lib/postgresql/tls
        install -m 644 -o postgres -g postgres /tls/server.crt /var/lib/postgresql/tls/server.crt
        install -m 600 -o postgres -g postgres /tls/server.key /var/lib/postgresql/tls/server.key
        # El servidor EXIGE TLS a los clientes de red: sin esto la imagen acepta también
        # conexiones sin cifrar y bastaría un cliente mal configurado para saltarse el TLS.
        # Los sockets locales (arranque de la imagen, `pg_isready`, `docker exec`) no pasan
        # por la red y se dejan como los trae la imagen.
        cat > /var/lib/postgresql/tls/pg_hba.conf <<'HBA'
      local   all all                 trust
      hostssl all all all             scram-sha-256
      hostnossl all all all           reject
      HBA
        chown postgres:postgres /var/lib/postgresql/tls/pg_hba.conf
        chmod 600 /var/lib/postgresql/tls/pg_hba.conf
        set -- "$$@" \
          -c hba_file=/var/lib/postgresql/tls/pg_hba.conf \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key \
          -c ssl_min_protocol_version=TLSv1.2
      else
        set -- "$$@" -c ssl=off
      fi

      exec docker-entrypoint.sh "$$@"

networks:
  # Internet hasta nginx.
  edge:
    name: ${APP_NAME:-sede}-edge
  # nginx hasta la aplicación y hasta el servidor del sitio.
  backend:
    name: ${APP_NAME:-sede}-backend
    internal: false
  # Base, caché y almacenamiento. Marcada interna: ningún servicio de datos es
  # alcanzable desde fuera de la pila, aunque alguien publique un puerto por
  # descuido.
  data:
    name: ${APP_NAME:-sede}-data
    internal: true
  # Sólo el sitio y Redis (T9.5). Aparte de `data` para que el sitio, el servicio más expuesto,
  # no llegue a PostgreSQL; interna para que nada entre ni salga de la pila por ella.
  cache-sitio:
    name: ${APP_NAME:-sede}-cache-sitio
    internal: true

volumes:
  # Estilo de bloque, no de flujo: el `:` de `${APP_NAME:-sede}` se lee como
  # separador de clave dentro de una llave y rompe el archivo.
  datos-postgres:
    name: ${APP_NAME:-sede}-datos-postgres
  datos-redis:
    name: ${APP_NAME:-sede}-datos-redis
  almacenamiento-app:
    name: ${APP_NAME:-sede}-almacenamiento-app
  # Copias de seguridad de la base. Volumen PROPIO, separado del almacenamiento de
  # la aplicación. Sigue estando en el mismo servidor: protege de errores lógicos y
  # borrados, no de perder la máquina (docs/copias-de-seguridad.md).
  copias:
    name: ${APP_NAME:-sede}-copias
  certbot-webroot:
    name: ${APP_NAME:-sede}-certbot-webroot
