                        descripcion: Planes, programas y proyectos
                        orden: 4
                        numero_ley: 4
                      - id: 5
                        type: subseccion-transparencia
                        codigo: tramites
                        nombre: Trámites y servicios
                        descripcion: Catálogo de trámites
                        orden: 5
                        numero_ley: 5
                      - id: 6
                        type: subseccion-transparencia
                        codigo: participa
                        nombre: Participación ciudadana
                        descripcion: Mecanismos de participación
                        orden: 6
                        numero_ley: 6
                      - id: 7
