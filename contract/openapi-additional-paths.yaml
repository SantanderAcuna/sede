# ══════════════════════════════════════════════════════════════════════════════
# PANEL — TRANSPARENCIA (CRUD autenticado)
# ══════════════════════════════════════════════════════════════════════════════
  /panel/transparencia/documentos:
    get:
      tags: [Panel — Transparencia]
      operationId: listarDocumentosPanel
      summary: Listado de documentos (incluye borradores)
      description: CRUD completo para administradores. RF-02-021.
      x-status: pending
      x-criterios: [RF-02-021]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [borrador, revision, publicado, despublicado, archivado]
        - name: autor_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Lista completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoCollection'
      security:
        - cookieSesion: []

    post:
      tags: [Panel — Transparencia]
      operationId: crearDocumento
      summary: Crear documento (multipart)
      x-status: pending
      x-criterios: [RF-02-021]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, titulo, subseccion_id, tipo_documento_id]
              properties:
                archivo: { type: string, format: binary }
                titulo: { type: string }
                descripcion: { type: string }
                subseccion_id: { type: integer }
                categoria_id: { type: integer }
                tipo_documento_id: { type: integer }
                fecha_publicacion: { type: string, format: date }
                periodicidad:
                  type: string
                  enum: [anual, semestral, trimestral, mensual, eventual]
                destacado: { type: boolean }
      responses:
        '201':
          description: Documento creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentoItem'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

  /panel/transparencia/documentos/{id}:
    patch:
      tags: [Panel — Transparencia]
      operationId: actualizarDocumento
      summary: Actualizar documento
      description: Actualiza documento, incluyendo reemplazo de archivo. RF-02-021.
      x-status: pending
      x-criterios: [RF-02-021]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: { type: string }
                descripcion: { type: string }
                estado:
                  type: string
                  enum: [borrador, revision, publicado, despublicado, archivado]
                fecha_publicacion: { type: string, format: date }
                motivo_cambio: { type: string }
      responses:
        '200':
          description: Documento actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentoItem'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

    delete:
      tags: [Panel — Transparencia]
      operationId: eliminarDocumento
      summary: Soft-delete de documento
      x-status: pending
      x-criterios: [RF-02-021]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Eliminado (soft delete)
      security:
        - cookieSesion: []

