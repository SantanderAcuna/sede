# Fecha: 2026-10-02

# ══════════════════════════════════════════════════════════════════════════════
# SALUD
# ══════════════════════════════════════════════════════════════════════════════
  /salud:
    get:
      tags: [Salud]
      operationId: healthCheck
      summary: Health check de la API
      description: Verifica que el servicio esté operativo.
      x-status: implemented
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          timestamp: { type: string, format: date-time }
                          version: { type: string, example: "1.0.0" }
              examples:
                ok:
                  value:
                    success: true
                    message: null
                    data:
                      status: ok
                      timestamp: "2026-10-02T14:00:00.000000Z"
                      version: "1.0.0"
                    errors: null
        '503':
          description: Servicio degradado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'

