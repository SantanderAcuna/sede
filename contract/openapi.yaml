  # ══════════════════════════════════════════════════════════════════════════════
  # BÚSQUEDA GLOBAL
  # ══════════════════════════════════════════════════════════════════════════════
  /busqueda/sugerencias:
    get:
      tags: [Buscar]
      operationId: sugerirBusqueda
      summary: Sugerencias mientras se escribe
      description: |
        Hasta 10 sugerencias para el buscador del encabezado (RF-B1-006, RF-B2-036).

        Busca **sólo contenido de la sede** (hoy: trámites y políticas) y es tolerante
        a tildes, mayúsculas y erratas: «licensia» sugiere «Licencia de …». Con menos
        de 3 caracteres la respuesta es `422` y el cliente no debe consultar.

        Es una operación **distinta** de `/buscar` a propósito: la respuesta de una
        operación no puede cambiar de forma según un parámetro, porque el cliente
        generado no podría tiparla. Aquí la forma es liviana y fija; allí, la completa.

        Un contenido es una sugerencia si su parecido con lo escrito alcanza el umbral
        de pertinencia **y** cada palabra de cuatro letras o más de la consulta aparece
        en él (con tolerancia a erratas): por eso «licencia de conducción» no sugiere
        «licencia de exhumación». Ver `docs/busqueda.md`.

        Público, con un límite de peticiones por IP compartido con `/buscar`; al
        superarlo, `429` con `Retry-After`.

        El texto buscado es dato del ciudadano y puede contener datos personales
        (un número de documento, por ejemplo): no se guarda ni se registra en la
        aplicación, y el registro de acceso del servidor web lo omite.
      x-status: implemented
      x-criterios: [RF-01-009, RF-B1-006, RF-B2-036, RNF-REND-01]
      parameters:
        - name: q
          in: query
          required: true
          description: Texto escrito hasta ahora (de 3 a 120 caracteres)
          schema: { type: string, minLength: 3, maxLength: 120 }
        - name: limite
          in: query
          required: false
          description: Máximo de sugerencias (por encima de 10 la respuesta es 422)
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        '200':
          description: Sugerencias, de la más a la menos pertinente (puede ser una lista vacía)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        maxItems: 10
                        items: { $ref: '#/components/schemas/SugerenciaBusquedaItem' }
              examples:
                con_errata:
                  summary: «licensia» sugiere licencias
                  value:
                    success: true
                    message: null
                    data:
                      - id: 35
                        type: sugerencias-busqueda
                        titulo: Licencia de intervención del espacio público
                        categoria: Trámite
                        tipo_recurso: tramite
                        url: /tramites/licencia-de-intervencion-del-espacio-publico
                        score: 0.56
                    errors: null
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /buscar:
    get:
      tags: [Buscar]
      operationId: buscarGlobal
      summary: Resultados de la búsqueda, por pertinencia
      description: |
        Resultados completos de la búsqueda (RF-B1-005, RF-B2-035), ordenados por
        pertinencia y paginados. Sólo contenido de la sede (hoy: trámites y
        políticas); las secciones estáticas del sitio las lista el propio sitio.

        Cada resultado lleva fecha, categoría, título y extracto. `autor` y
        `miniatura` viajan siempre y son `null` mientras el contenido no los tenga:
        ningún contenido de hoy los tiene y no se inventan.

        Misma tolerancia, mismo criterio de pertinencia, mismo límite de peticiones y
        misma privacidad que `/busqueda/sugerencias`. Ver `docs/busqueda.md`.
      x-status: implemented
      x-criterios: [RF-01-009, RF-B1-005, RF-B2-035, RNF-REND-01]
      parameters:
        - name: q
          in: query
          required: true
          description: Texto buscado (de 3 a 120 caracteres)
          schema: { type: string, minLength: 3, maxLength: 120 }
        - name: tipo
          in: query
          required: false
          description: Acota la búsqueda a un tipo de contenido. Sin valor, busca en todos.
          schema:
            type: string
            enum: [tramite, politica]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de resultados (`data` vacío si nada alcanza el umbral de pertinencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaCollection'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  # `/sitemap.xml` y `/robots.txt` NO son operaciones de esta API: los sirve el sitio (Nuxt) en la
  # raíz del dominio, no bajo `/api/v1`. Se probaron fuera del contrato (RF-01-010:
  # `sitio/tests/sitemap.mjs`, `sitio/tests/robots.mjs`). Ver ADR-0020.

  /consentimientos:
    post:
      tags: [Consentimientos]
      operationId: registrarConsentimiento
      summary: Registrar un consentimiento de cookies
      description: |
        Guarda lo que decidió un navegador sobre las cookies no esenciales: el evento,
        las categorías vigentes tras él y la versión de la política. La fecha la pone
        el servidor. **No se guarda IP, agente de usuario ni identificador alguno**: no
        hay forma de saber quién consintió, sólo qué se consintió y cuándo.

        Eventos: `aceptado`, `rechazado`, `revocado` y `caducado` (el consentimiento
        guardado venció o es de una versión anterior de la política y se bloqueó la
        categoría que había aceptado). Los registros se borran al cumplirse el plazo
        de retención (`consentimientos.retencion_dias`).

        Es público y limita a treinta peticiones por minuto y por IP.
      x-status: implemented
      x-criterios: [RF-B1-008, RF-01-D01, RN-01-D01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evento, categorias, version_politica]
              properties:
                evento:
                  type: string
                  enum: [aceptado, rechazado, revocado, caducado]
                categorias:
                  type: array
                  description: Categorías opcionales vigentes tras el evento; vacío = sólo las necesarias.
                  uniqueItems: true
                  items:
                    type: string
                    enum: [analitica, preferencias]
                version_politica:
                  type: integer
                  minimum: 1
                  maximum: 65535
            example:
              evento: aceptado
              categorias: [analitica]
              version_politica: 1
      responses:
        '201':
          description: Consentimiento registrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, type, evento, categorias, version_politica, registrado_en]
                        properties:
                          id: { type: integer }
                          type: { type: string, enum: [consentimiento] }
                          evento: { type: string, enum: [aceptado, rechazado, revocado, caducado] }
                          categorias:
                            type: array
                            items: { type: string, enum: [analitica, preferencias] }
                          version_politica: { type: integer }
                          registrado_en: { type: string, format: date-time }
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /politicas:
    get:
      tags: [Políticas]
      operationId: listarPoliticas
      summary: Las cinco políticas, sin el texto
      description: |
