  # PANEL — POLÍTICAS
  # ══════════════════════════════════════════════════════════════════════════════
  /panel/politicas:
    get:
      tags: [Panel — Políticas]
      operationId: listarPoliticasPanel
      summary: Las políticas con su estado de completitud
      description: Requiere el permiso `politicas.gestionar`.
      x-status: implemented
      x-criterios: [RF-B1-009, RF-B2-008, RF-B2-009, RF-B2-010]
      responses:
        '200':
          description: Políticas con apartados exigidos, `completa` y `problemas`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PoliticaPanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
      security:
        - cookieSesion: []

  /panel/politicas/{slug}:
    patch:
      tags: [Panel — Políticas]
      operationId: actualizarPolitica
      summary: Editar una política
      description: |
        Actualización parcial; los campos no enviados conservan su valor. Requiere el
        permiso `politicas.gestionar`.

        Si cambia el texto y no se envía `version`, la versión sube sola. La política
        debe quedar completa: todos sus apartados con texto y sin «en preparación». Para
        pasar `es_ejemplo` a `false` hacen falta además la vigencia y el acto
        administrativo (tipo, número y fecha) sin marcadores «[por ...]»; si no, `422`.
        La versión de `uso-de-cookies` es la que el sitio usa para volver a pedir el
        consentimiento (RN-01-D01).
      x-status: implemented
      x-criterios: [RF-B1-009, RF-B2-008, RF-B2-009, RF-B2-010, RN-01-D01]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoliticaInput' }
      responses:
        '200':
          description: Política actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PoliticaPanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

