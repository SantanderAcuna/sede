openapi: 3.1.0

info:
  title: Sede Electrónica — Alcaldía Distrital de Santa Marta
  version: 1.0.0
  summary: API REST de la sede electrónica del Distrito Turístico, Cultural e Histórico de Santa Marta.
  description: |
    Fuente de verdad única del intercambio HTTP entre el backend y sus dos clientes:
    el sitio público y el panel de administración.

    # Convención de respuesta

    Todas las respuestas usan un **sobre plano** con media type `application/json`:

    ```json
    { "success": true, "message": null, "data": { }, "errors": null }
    ```

    Las colecciones añaden `meta` con las siete claves del paginador y `links` con
    cuatro. Los errores devuelven `success: false`, un `message` legible y, cuando
    corresponde, un objeto `errors` con una entrada por campo.

    El media type `application/vnd.api+json` **no se usa**.

    # Convenciones de autoría

    | Regla | Convención |
    |---|---|
    | Media type | `application/json` |
    | `id` | Entero, nunca cadena |
    | `type` | Plural en kebab-case, declarado con `const` |
    | Campos autogenerados | Marcados `readOnly` y excluidos de las peticiones |
    | Actualización | Verbo `PATCH`, nunca `PUT` |
    | Paginación | `page` y `per_page`; `per_page` máximo 100 |
    | Errores de validación | `errors` con clave por campo |
  contact:
    name: Equipo de la Sede Electrónica
  license:
    name: Uso institucional

servers:
  - url: https://staging.santamarta.gov.co/api/v1
    description: Entorno de pruebas
  - url: http://127.0.0.1:8010/api/v1
    description: Desarrollo local

tags:
  - name: Entidad
    description: Datos institucionales de la autoridad titular
  - name: Trámites
