  # ══════════════════════════════════════════════════════════════════════════════
  # PANEL — AUTH (Sanctum)
  # ══════════════════════════════════════════════════════════════════════════════
  /panel/login:
    post:
      tags: [Panel — Auth]
      operationId: login
      summary: Iniciar sesión
      description: Autenticación con Sanctum. Puede requerir MFA si está habilitado. RF-SEG-02.
      x-status: pending
      x-criterios: [RF-SEG-02, RNF-SEG-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example:
              email: usuario@santamarta.gov.co
              password: "********"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          require_mfa: { type: boolean }
                          mfa_token: { type: [string, 'null'] }
                          csrf_token: { type: [string, 'null'] }
                          user: { $ref: '#/components/schemas/UsuarioItem' }
              examples:
                simple:
                  value:
                    success: true
                    message: "Sesión iniciada"
                    data:
                      require_mfa: false
                      mfa_token: null
                      csrf_token: "eyJ..."
                      user:
                        id: 1
                        type: usuario
                        email: admin@santamarta.gov.co
                        mfa_habilitado: false
                        estado: activo
                        roles:
                          - id: 1
                            type: rol
                            nombre: super-admin
                            permisos: ["*"]
                    errors: null
                con_mfa:
                  value:
                    success: true
                    message: "Código MFA requerido"
                    data:
                      require_mfa: true
                      mfa_token: "eyJ..."
                      csrf_token: null
                      user: null
                    errors: null
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /panel/mfa:
    post:
      tags: [Panel — Auth]
      operationId: verificarMfa
      summary: Verificar código MFA TOTP
      x-status: pending
      x-criterios: [RF-SEG-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
            example:
              mfa_token: "eyJ..."
              code: "123456"
      responses:
        '200':
          description: MFA verificado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          csrf_token: { type: string }
                          user: { $ref: '#/components/schemas/UsuarioItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security: []

  /panel/logout:
    post:
      tags: [Panel — Auth]
      operationId: logout
      summary: Cerrar sesión
      x-status: pending
      responses:
        '204':
          description: Sesión cerrada
      security:
        - cookieSesion: []

  # ══════════════════════════════════════════════════════════════════════════════
  # PANEL — TRANSPARENCIA (CRUD autenticado)
