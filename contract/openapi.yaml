        - cookieSesion: []

  /panel/noticias/{uuid}/imagen:
    get:
      tags: [Panel — Noticias]
      operationId: obtenerImagenNoticiaPanel
      summary: Ver la imagen de una noticia, publicada o no
      description: |
        Requiere `noticias.gestionar`. A diferencia de `GET /noticias/{slug}/imagen`,
        entrega también la imagen de un borrador o de una noticia programada, para que
        el panel la muestre al editarla. Va con `Cache-Control: private, no-store`: un
        borrador no debe quedar en una caché compartida. 404 si la noticia no existe o
        no tiene imagen.
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El archivo de imagen
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
        - cookieSesion: []
    post:
      tags: [Panel — Noticias]
      operationId: subirImagenNoticia
      summary: Subir o reemplazar la imagen de una noticia
      description: |
        Requiere `noticias.gestionar`. La imagen y su texto alternativo (`alt`) van
        siempre juntos: sin `alt` (o con sólo espacios) no se guarda nada y la
        respuesta es `422`. PNG, JPG o WebP, hasta 5 MB. La nueva reemplaza a la
        anterior: una noticia tiene una sola imagen.
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen, alt]
              properties:
                imagen: { type: string, format: binary }
                alt:
                  type: string
                  maxLength: 250
                  description: Describe lo que muestra la imagen para quien no la ve.
      responses:
        '200':
          description: Imagen guardada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NoticiaPanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

  # ══════════════════════════════════════════════════════════════════════════════
  # PANEL — IMÁGENES DEL CONTENIDO
  # ══════════════════════════════════════════════════════════════════════════════
  /contenido/imagenes/{uuid}:
    get:
      tags: [Panel — Imágenes del contenido]
      operationId: obtenerImagenContenido
      summary: Una imagen insertada en el contenido publicado
      description: |
        Pública, con límite de peticiones. Sólo sirve las imágenes subidas por el editor
        del panel (colección «contenido»); cualquier otro archivo responde 404. Lleva
        `Cache-Control: public, max-age=86400, immutable` y `X-Content-Type-Options: nosniff`.
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El archivo de imagen
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /panel/contenido/imagenes:
    post:
      tags: [Panel — Imágenes del contenido]
      operationId: subirImagenContenido
      summary: Subir una imagen para insertarla en el contenido
      description: |
        Requiere `noticias.gestionar`, `politicas.gestionar` o `entidad.gestionar`. La
        imagen y su texto alternativo (`alt`) van siempre juntos. PNG, JPG o WebP, hasta
        5 MB y 4000 px por lado. Se re-codifica antes de guardarse (sin EXIF ni bytes
        añadidos). Devuelve la URL pública con la que se inserta en el HTML.
      x-status: implemented
      x-criterios: [RF-01-013]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen, alt]
              properties:
                imagen: { type: string, format: binary }
                alt:
                  type: string
                  maxLength: 250
                  description: Describe lo que muestra la imagen para quien no la ve.
      responses:
        '201':
          description: Imagen subida
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [uuid, url, alt]
                        properties:
                          uuid: { type: string, format: uuid }
                          url: { type: string, example: /api/v1/contenido/imagenes/0b9e0a5e-3a52-4c43-9f0e-5a0f4a4e2c11 }
                          alt: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

