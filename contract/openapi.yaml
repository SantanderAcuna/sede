  /panel/noticias:
    get:
      tags: [Panel — Noticias]
      operationId: listarNoticiasPanel
      summary: Todas las noticias, borradores incluidos
      description: |
        Requiere el permiso `noticias.gestionar`. Alimenta la tabla del panel: cada
        elemento trae lo necesario para listar y abrir la noticia (`uuid`, `estado`,
        `activo`, `fecha_publicacion`, la imagen y lo que falta para publicarla) y NO trae
        el cuerpo (`contenido`); ése se pide al abrirla, con `GET /panel/noticias/{uuid}`.

        Se puede buscar por título (`q`), filtrar por `estado` y ordenar. Sin parámetros,
        las más recientes primero. La búsqueda ignora mayúsculas y trata `%`, `_` y `\`
        como texto, no como comodines. Cualquier valor fuera de lo declarado es 422.
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - name: per_page
          in: query
          required: false
          description: Elementos por página. Por encima de 100 la respuesta es 422.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: q
          in: query
          required: false
          description: Texto que debe contener el título (sin distinguir mayúsculas). Hasta 100 caracteres.
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          required: false
          description: |
            `borrador` (sin marcar como publicada), `programada` (publicada, con fecha
            futura) o `publicada` (publicada y con la fecha cumplida; la que el sitio muestra).
          schema: { $ref: '#/components/schemas/EstadoNoticia' }
        - name: ordenar_por
          in: query
          required: false
          description: Columna de orden.
          schema: { type: string, enum: [fecha_publicacion, titulo], default: fecha_publicacion }
        - name: direccion
          in: query
          required: false
          description: Sentido del orden. Por omisión `desc` para la fecha y `asc` para el título.
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticiaPanelCollection'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []
    post:
      tags: [Panel — Noticias]
      operationId: crearNoticia
      summary: Crear una noticia (nace como borrador)
      description: |
        Requiere `noticias.gestionar`. Título hasta 150 caracteres y descripción hasta
        200 (RF-01-013). La dirección (`slug`) se genera del título y no cambia después.
        La imagen se sube aparte, con `POST /panel/noticias/{uuid}/imagen`.
      x-status: implemented
      x-criterios: [RF-01-013]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticiaInput' }
      responses:
        '201':
          description: Noticia creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NoticiaPanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

  /panel/noticias/{uuid}:
    get:
      tags: [Panel — Noticias]
      operationId: obtenerNoticiaPanel
      summary: Una noticia con su estado de publicación
