  # ══════════════════════════════════════════════════════════════════════════════
  # NOTICIAS
  # ══════════════════════════════════════════════════════════════════════════════
  /noticias:
    get:
      tags: [Noticias]
      operationId: listarNoticias
      summary: Noticias publicadas
      description: |
        Las noticias publicadas, de la más reciente a la más antigua (con la misma
        fecha, la de `id` mayor). El home pide `per_page=6`. No se listan los
        borradores, las programadas a futuro ni las eliminadas. Sin noticias responde
        `data: []` (CT-01): el sitio decide qué decir. El listado no incluye el cuerpo
        (`contenido`), sólo el detalle. RF-01-013.
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - name: per_page
          in: query
          required: false
          description: Elementos por página (1 a 100; por encima, 422).
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: destacada
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticiaCollection'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /noticias/{slug}:
    get:
      tags: [Noticias]
      operationId: obtenerNoticia
      summary: Detalle de una noticia publicada
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Noticia, con su cuerpo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NoticiaItem'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /noticias/{slug}/imagen:
    get:
      tags: [Noticias]
      operationId: obtenerImagenNoticia
      summary: Imagen de una noticia publicada
      description: |
        La imagen en una dirección estable (no una URL firmada, que caduca a los 15
        minutos). Lleva `ETag` y `Cache-Control: public, max-age=300`, y no instala
        cookies. Tiene su propio límite de peticiones, aparte del de las lecturas de
        datos. 404 si la noticia no está publicada o no tiene imagen.
      x-status: implemented
      x-criterios: [RF-01-013]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: El archivo de imagen
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
      security: []

  /banners:
    get:
      tags: [Banners]
      operationId: listarBanners
      summary: Diapositivas vigentes del carrusel de la portada
      description: |
        Solo las activas y dentro de su vigencia (`vigente_desde` ≤ ahora < `vigente_hasta`), en el
        orden elegido en el panel. Cada una trae su imagen con texto alternativo; nada interno
        (ni identificador numérico, ni estado, ni fechas). Sin diapositivas, `data` es una lista vacía
        y el sitio usa su portada de respaldo.
      x-status: implemented
      x-criterios: [CAG-02, CAG-04]
      responses:
        '200':
          description: Diapositivas vigentes
          content:
