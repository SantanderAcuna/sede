# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sesión de la SPA con cookie `HttpOnly`. Es el mecanismo del panel.
    portador:
      type: http
      scheme: bearer
      description: Token de API, para clientes que no son un navegador.

  parameters:
    Pagina:
      name: page
      in: query
      required: false
      description: Número de página, empezando en 1
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: per_page
      in: query
      required: false
      description: Elementos por página. Por encima de 100 la respuesta es 422.
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  responses:
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            no_encontrado:
              value:
                success: false
                message: "El recurso no fue encontrado."
                data: null
                errors: null

    ValidacionInvalida:
      description: La petición no cumple el contrato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            validacion:
              value:
                success: false
                message: "Error de validación."
                data: null
                errors:
                  per_page:
                    - "El campo per_page no puede ser mayor que 100."

    NoAutenticado:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            no_autenticado:
              value:
                success: false
                message: "No autenticado."
                data: null
                errors: null

    DemasiadasSolicitudes:
      description: Demasiadas solicitudes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            rate_limit:
              value:
                success: false
                message: "Demasiadas solicitudes. Intenta más tarde."
                data: null
                errors: null

  # ══════════════════════════════════════════════════════════════════════════════
  # SCHEMAS
  # ══════════════════════════════════════════════════════════════════════════════
  schemas:

    # ─── Esquemas compartidos ───────────────────────────────────────────────
    ApiEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: [string, 'null'] }
        data: { type: [object, array, 'null'] }
        errors: { type: [object, 'null'] }

    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [meta, links]
          properties:
            data: { type: array }
            meta: { $ref: '#/components/schemas/PageMeta' }
            links: { $ref: '#/components/schemas/CollectionLinks' }

    PageMeta:
      type: object
      required: [current_page, from, last_page, path, per_page, to, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        from: { type: [integer, 'null'], minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        path: { type: string }
        per_page: { type: integer, minimum: 1 }
        to: { type: [integer, 'null'], minimum: 1 }
        total: { type: integer, minimum: 0 }

    CollectionLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }

    ApiError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: [object, 'null'] }

    # ─── Entidad ──────────────────────────────────────────────────────────
    EntidadItem:
      type: object
      required: [id, type, nombre]
      properties:
        id: { type: integer }
        type: { type: string, const: entidad }
        nombre: { type: string }
        sigla: { type: [string, 'null'] }
        nit: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        municipio: { type: [string, 'null'] }
        departamento: { type: [string, 'null'] }
        pais: { type: [string, 'null'] }
        telefono: { type: [string, 'null'] }
        linea_atencion: { type: [string, 'null'] }
        linea_gratuita: { type: [string, 'null'] }
        linea_anticorrupcion: { type: [string, 'null'] }
        correo_atencion: { type: [string, 'null'], format: email }
        correo_notificaciones_judiciales: { type: [string, 'null'], format: email }
        horario: { type: [string, 'null'] }
        codigo_postal: { type: [string, 'null'] }
        dominio: { type: [string, 'null'] }
        logo: { type: [string, 'null'] }
        redes:
          type: array
          items: { $ref: '#/components/schemas/EntidadRed' }
        politicas:
          type: array
          description: Las cinco políticas obligatorias que el pie debe enlazar.
          items: { $ref: '#/components/schemas/EntidadPolitica' }
        datos_por_confirmar:
          type: array
          description: |
            Campos que la entidad todavía no ha ratificado formalmente. Se publican
            como pendientes en lugar de inventarse.
          items: { type: string }

    EntidadRed:
      type: object
      required: [red, url]
      properties:
        red: { type: string, enum: [facebook, instagram, x, youtube, linkedin] }
        url: { type: string }

    EntidadPolitica:
      type: object
      required: [slug, nombre]
      properties:
        slug: { type: string }
        nombre: { type: string }
        actualizada_en: { type: [string, 'null'], format: date, readOnly: true }

    # ─── TopBar y Footer ───────────────────────────────────────────────────
    TopBarItem:
      type: object
      required: [id, type]
      properties:
        id: { type: integer }
        type: { type: string, const: top-bar }
        logo_path: { type: [string, 'null'], format: uri }
        url_govco: { type: [string, 'null'], format: uri }
        altura_px: { type: integer }
        idioma_default: { type: string }

    FooterItem:
      type: object
      required: [id, type, nombre_autoridad]
      properties:
        id: { type: integer }
        type: { type: string, const: footer }
        nombre_autoridad: { type: string }
        nit: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        codigo_postal: { type: [string, 'null'] }
        municipio: { type: [string, 'null'] }
        departamento: { type: [string, 'null'] }
        horario: { type: [string, 'null'] }
        commutador: { type: [string, 'null'] }
        linea_anticorrupcion: { type: [string, 'null'] }
        correo_institucional: { type: [string, 'null'], format: email }
        correo_notificaciones: { type: [string, 'null'], format: email }
        redes:
          type: array
          items: { $ref: '#/components/schemas/EntidadRed' }
        politicas:
          type: array
          items: { $ref: '#/components/schemas/EntidadPolitica' }

    # ─── Menú ─────────────────────────────────────────────────────────────
    MenuItem:
      type: object
      required: [id, type, slug, etiqueta, orden, visible, tipo]
      properties:
        id: { type: integer }
        type: { type: string, const: menu-item }
        slug: { type: string }
        etiqueta: { type: string }
        ruta: { type: [string, 'null'] }
        descripcion: { type: [string, 'null'] }
        orden: { type: integer }
        visible: { type: boolean }
        tipo: { type: string, enum: [interno, externo, ancla, modal] }
        hijos:
          type: array
          description: Submenús (máximo 2 niveles)
          items: { $ref: '#/components/schemas/MenuItem' }

    # ─── Política ──────────────────────────────────────────────────────────
    PoliticaItem:
      type: object
      required: [id, type, codigo, nombre]
      properties:
        id: { type: integer }
        type: { type: string, const: politica }
        codigo:
          type: string
          enum: [terminos, privacidad, cookies, derechos-autor, accesibilidad]
        nombre: { type: string }
        contenido_html: { type: [string, 'null'] }
        tipo:
          type: string
          enum: [legal, seguridad, privacidad, institucional]
        vigente: { type: boolean }
        actualizada_en: { type: [string, 'null'], format: date, readOnly: true }

    # ─── Noticias ──────────────────────────────────────────────────────────
    NoticiaItem:
      type: object
      required: [id, type, slug, titulo, fecha_publicacion]
      properties:
        id: { type: integer }
        type: { type: string, const: noticia }
        slug: { type: string }
        titulo: { type: string }
        descripcion_corta: { type: [string, 'null'] }
        contenido_html: { type: [string, 'null'] }
        fecha_publicacion: { type: string, format: date-time }
        destacada: { type: boolean }
        activo: { type: boolean }
        imagen_url: { type: [string, 'null'], format: uri }
        categorias:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    NoticiaCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/NoticiaItem' }

    # ─── Subsección Transparencia ──────────────────────────────────────────
    SubseccionTransparenciaItem:
      type: object
      required: [id, type, codigo, nombre, orden]
      properties:
        id: { type: integer }
        type: { type: string, const: subseccion-transparencia }
        codigo:
          type: string
          enum: [informacion-entidad, normativa, contratacion, planeacion, tramites, participa, datos-abiertos, grupos-interes, reporte-especifico, tributaria]
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        orden: { type: integer, minimum: 1, maximum: 10 }
        numero_ley: { type: integer, minimum: 1, maximum: 10 }
        url: { type: [string, 'null'], format: uri }

    # ─── Documentos ────────────────────────────────────────────────────────
    DocumentoItem:
      type: object
      required: [id, type, slug, titulo, estado]
      properties:
        id: { type: integer }
        type: { type: string, const: documento }
        slug: { type: string }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        fecha_publicacion: { type: [string, 'null'], format: date }
        fecha_documento: { type: [string, 'null'], format: date }
        periodicidad:
          type: [string, 'null']
          enum: [anual, semestral, trimestral, mensual, eventual, null]
        estado:
          type: string
          enum: [borrador, revision, publicado, despublicado, archivado]
        destacado: { type: boolean }
        indice_lecturabilidad: { type: [number, 'null'] }
        hash_sha256: { type: [string, 'null'] }
        tamano_bytes: { type: [integer, 'null'] }
        formato_abierto: { type: boolean }
        subseccion: { $ref: '#/components/schemas/SubseccionTransparenciaItem' }
        categoria: { type: [object, 'null'] }
        tipo_documento: { type: [object, 'null'] }
        archivo_url: { type: [string, 'null'], format: uri }
        autor:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
        metadatos:
          type: array
          items: { $ref: '#/components/schemas/MetadatoItem' }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/DocumentoVersionItem' }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    MetadatoItem:
      type: object
      required: [id, type, clave, valor]
      properties:
        id: { type: integer }
        type: { type: string, const: metadato }
        clave: { type: string }
        valor: { type: string }

    DocumentoVersionItem:
      type: object
      required: [id, version, fecha]
      properties:
        id: { type: integer }
        version: { type: string }
        fecha: { type: string, format: date-time }
        hash_sha256: { type: string }
        url: { type: string, format: uri }

    DocumentoCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentoItem' }

    # ─── Servidor Público ─────────────────────────────────────────────────
    ServidorPublicoItem:
      type: object
      required: [id, type, nombres, apellidos, cargo]
      properties:
        id: { type: integer }
        type: { type: string, const: servidor-publico }
        codigo_sigep: { type: [string, 'null'] }
        nombres: { type: string }
        apellidos: { type: string }
        cargo: { type: string }
        correo_institucional: { type: [string, 'null'], format: email }
        extension: { type: [string, 'null'] }
        dependencia:
          type: object
          properties:
            id: { type: integer }
            codigo: { type: string }
            nombre: { type: string }

    # ─── Calendario Tributario ─────────────────────────────────────────────
    CalendarioTributarioItem:
      type: object
      required: [id, type, impuesto, vigencia, fecha_vencimiento]
      properties:
        id: { type: integer }
        type: { type: string, const: calendario-tributario }
        impuesto:
          type: string
          enum: [predial, ica, otros]
        vigencia: { type: integer }
        fecha_vencimiento: { type: string, format: date }
        descripcion: { type: [string, 'null'] }
        aplica_a: { type: [string, 'null'] }

    # ─── Búsqueda ──────────────────────────────────────────────────────────
    SugerenciaBusquedaItem:
      type: object
      required: [id, type, texto, url]
      properties:
        id: { type: integer }
        type: { type: string, const: sugerencia }
        texto: { type: string }
        url: { type: string, format: uri }
        tipo_recurso:
          type: string
          enum: [documento, noticia, tramite, servidor]
        score: { type: number }

    BusquedaResult:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentoItem' }
            meta:
              type: object
              required: [total, termino]
              properties:
                total: { type: integer }
                termino: { type: string }
                tiempo_ms: { type: integer }

    # ─── Alertas ───────────────────────────────────────────────────────────
    AlertaPublicacionItem:
      type: object
      required: [id, type, tipo, mensaje, dias_anticipacion]
      properties:
        id: { type: integer }
        type: { type: string, const: alerta-publicacion }
        tipo:
          type: string
          enum: [plan-accion-31ene, informe-gestion-31ene, pqrsd-trimestral, control-interno-semestral, calendario-tributario]
        mensaje: { type: string }
        dias_anticipacion: { type: integer }
        activa: { type: boolean }
        vence_en: { type: [string, 'null'], format: date }

    # ─── Tablero ITA ──────────────────────────────────────────────────────
    TableroItaItem:
      type: object
      required: [id, type, porcentaje_cumplimiento]
      properties:
        id: { type: integer }
        type: { type: string, const: tablero-ita }
        porcentaje_cumplimiento: { type: number, minimum: 0, maximum: 100 }
        items_cumplen: { type: integer }
        items_no_cumplen: { type: integer }
        items_parcial: { type: integer }
        items_no_aplica: { type: integer }
        ultima_actualizacion: { type: string, format: date-time, readOnly: true }

    # ─── Auditoría ────────────────────────────────────────────────────────
    AuditoriaItem:
      type: object
      required: [id, type, accion, recurso, created_at]
      properties:
        id: { type: integer }
        type: { type: string, const: auditoria }
        accion:
          type: string
          enum: [crear, actualizar, eliminar, login, logout]
        recurso: { type: string }
        recurso_id: { type: [integer, 'null'] }
        cambios: { type: [object, 'null'] }
        ip_origen: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        usuario:
          type: object
          properties:
            id: { type: integer }
            email: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }

    AuditoriaCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditoriaItem' }

    # ─── Usuario ──────────────────────────────────────────────────────────
    UsuarioItem:
      type: object
      required: [id, type, email, estado]
      properties:
        id: { type: integer }
        type: { type: string, const: usuario }
        email: { type: string, format: email }
        mfa_habilitado: { type: boolean }
        estado:
          type: string
          enum: [activo, inactivo, bloqueado, pendiente]
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string, const: rol }
              nombre: { type: string }
              permisos:
                type: array
                items: { type: string }

    # ─── Trámites (completo) ───────────────────────────────────────────────
    TramiteItem:
      type: object
      required:
        - id
        - type
        - slug
        - nombre
        - modalidad
        - tiene_costo
        - costo
        - tiempo_solucion_dias
        - canal_inicio
        - consulta_estado
        - requisitos
        - url_ficha_gov_co
      properties:
        id: { type: integer }
        type: { type: string, const: tramites }
        slug: { type: string }
        nombre: { type: string }
        resumen: { type: [string, 'null'] }
        url_ficha_gov_co: { type: string, format: uri }
        procedencia: { $ref: '#/components/schemas/TramiteProcedencia' }
        modalidad:
          type: string
          enum: [en_linea, parcialmente_en_linea, presencial]
        tiene_costo:
          type: string
          enum: [gratuito, con_costo]
        costo:
          $ref: '#/components/schemas/TramiteCosto'
        tiempo_solucion_dias: { type: integer, minimum: 0 }
        canal_inicio:
          type: string
          enum: [propio, portal_nacional]
        url_inicio: { type: [string, 'null'] }
        consulta_estado: { type: string }
        requisitos:
          type: array
          items: { $ref: '#/components/schemas/TramiteRequisito' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/TramiteDocumento' }
        perfiles:
          type: array
          items: { type: string, maxLength: 60 }
        resultado: { type: [string, 'null'] }
        puntos_atencion:
          type: array
          items: { $ref: '#/components/schemas/TramitePuntoAtencion' }
        normativa:
          type: array
          items: { $ref: '#/components/schemas/TramiteNorma' }
        canales_consulta_estado:
          type: array
          items: { $ref: '#/components/schemas/TramiteCanalConsulta' }
        categoria:
          oneOf:
            - $ref: '#/components/schemas/TramiteCategoria'
            - type: 'null'
        pasos:
          type: array
          items: { $ref: '#/components/schemas/TramitePaso' }
        publicado_en: { type: [string, 'null'], format: date-time, readOnly: true }
        actualizado_en: { type: [string, 'null'], format: date-time, readOnly: true }

    TramiteCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TramiteItem' }

    TramiteCategoria:
      type: object
      required: [slug, nombre]
      properties:
        slug: { type: string }
        nombre: { type: string }

    TramiteRequisito:
      type: object
      required: [tipo, descripcion]
      properties:
        tipo:
          type: string
          enum: [documento, verificacion_institucional, solicitud, formulario, pago]
        descripcion: { type: string, maxLength: 500 }
        obligatorio: { type: boolean, default: true }
        cantidad: { type: [integer, 'null'], minimum: 0 }
        unidad_cantidad: { type: [string, 'null'], maxLength: 40 }
        nota: { type: [string, 'null'], maxLength: 500 }
        canal: { type: [string, 'null'], enum: [web, presencial, correo, telefonico, null] }
        url: { type: [string, 'null'], format: uri }
        correo: { type: [string, 'null'], format: email }

    TramiteCosto:
      type: object
      required: [tiene_costo]
      properties:
        tiene_costo: { type: string, enum: [gratuito, con_costo] }
        tipo_valor:
          type: [string, 'null']
          enum: [fijo, smlv, avaluo_liquidacion, rango, null]
        valor:
          type: [string, 'null']
          maxLength: 30
        moneda: { type: [string, 'null'], maxLength: 20 }
        url_pago: { type: [string, 'null'], format: uri }
        descripcion: { type: [string, 'null'], maxLength: 1000 }
        cuentas:
          type: array
          items: { $ref: '#/components/schemas/TramiteCuentaBancaria' }

    TramiteCuentaBancaria:
      type: object
      required: [entidad, numero_cuenta]
      properties:
        entidad: { type: string, maxLength: 120 }
        tipo_cuenta: { type: [string, 'null'], maxLength: 40 }
        titular: { type: [string, 'null'], maxLength: 120 }
        numero_cuenta: { type: string, maxLength: 40 }
        codigo_recaudo: { type: [string, 'null'], maxLength: 40 }

    TramitePuntoAtencion:
      type: object
      required: [nombre, direccion]
      properties:
        nombre: { type: string, maxLength: 160 }
        direccion: { type: string, maxLength: 240 }
        horario: { type: [string, 'null'], maxLength: 240 }
        telefono: { type: [string, 'null'], maxLength: 40 }
        municipio: { type: [string, 'null'], maxLength: 120 }
        departamento: { type: [string, 'null'], maxLength: 120 }
        latitud: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitud: { type: [number, 'null'], minimum: -180, maximum: 180 }

    TramiteNorma:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, maxLength: 120 }
        numero: { type: [string, 'null'], maxLength: 40 }
        anio: { type: [integer, 'null'], minimum: 1800, maximum: 2200 }
        articulos: { type: [string, 'null'], maxLength: 240 }
        url: { type: [string, 'null'], format: uri }
        url_descarga: { type: [string, 'null'], format: uri }

    TramiteCanalConsulta:
      type: object
      required: [canal, habilitado]
      properties:
        canal:
          type: string
          enum: [sede, presencial, telefonico, web, correo, otro]
        habilitado:
          type: boolean
        nombre: { type: [string, 'null'], maxLength: 160 }
        url: { type: [string, 'null'] }
        correo: { type: [string, 'null'], format: email }
        telefono: { type: [string, 'null'], maxLength: 40 }
        horario: { type: [string, 'null'], maxLength: 240 }

    TramiteDocumento:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        url: { type: [string, 'null'] }
        formato: { type: [string, 'null'] }

    TramitePaso:
      type: object
      required: [orden, titulo]
      properties:
        orden: { type: integer, minimum: 1 }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }

    TramiteProcedencia:
      type: object
      required: [fuente, obtenido_en]
      properties:
        fuente: { type: string, maxLength: 120 }
        url: { type: [string, 'null'], format: uri }
        obtenido_en: { type: string, format: date }
        nota: { type: [string, 'null'], maxLength: 500 }
        api: { type: [string, 'null'] }
        origen_por_campo:
          type: object
          additionalProperties:
            type: string
            enum: [fuente, derivado, entidad, ausente]
        derivados:
          type: array
          items: { $ref: '#/components/schemas/TramiteDerivacion' }
        faltantes:
          type: array
          items: { type: string, maxLength: 60 }

    TramiteDerivacion:
      type: object
      required: [campo, regla]
      properties:
        campo: { type: string, maxLength: 60 }
        regla: { type: string, maxLength: 500 }

    TramiteInput:
      type: object
      required:
        - nombre
        - modalidad
        - tiene_costo
        - tiempo_solucion_dias
        - canal_inicio
        - consulta_estado
        - url_ficha_gov_co
      properties:
        nombre: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 160 }
        resumen: { type: [string, 'null'], maxLength: 500 }
        url_ficha_gov_co: { type: string, format: uri, maxLength: 500 }
        modalidad: { type: string, enum: [en_linea, parcialmente_en_linea, presencial] }
        tiene_costo: { type: string, enum: [gratuito, con_costo] }
        costo:
          oneOf:
            - $ref: '#/components/schemas/TramiteCosto'
            - type: 'null'
        tiempo_solucion_dias: { type: integer, minimum: 0 }
        canal_inicio: { type: string, enum: [propio, portal_nacional] }
        url_inicio: { type: [string, 'null'], maxLength: 500 }
        consulta_estado: { type: string, maxLength: 500 }
