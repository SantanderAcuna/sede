  # ══════════════════════════════════════════════════════════════════════════════
  # PANEL — NOTICIAS
  # ══════════════════════════════════════════════════════════════════════════════
  /panel/tramites:
    get:
      tags: [Panel — Trámites]
      operationId: listarTramitesPanel
      summary: Todos los trámites, borradores incluidos
      description: |
        Requiere el permiso `tramites.gestionar`. Alimenta la tabla del panel: cada elemento
        trae lo justo para listar (código, nombre, estado, origen y lo que falta para
        publicarlo) y NO la ficha entera; ésa se pide con `GET /panel/tramites/{uuid}`.

        Se busca por nombre (sin distinguir mayúsculas ni tildes) o por código (`q`), se
        filtra por `estado` y se ordena. Sin parámetros, los editados más recientemente
        primero. Un valor fuera de lo declarado es 422.
      x-status: implemented
      x-criterios: [RF-01-006]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - name: per_page
          in: query
          required: false
          description: Elementos por página. Por encima de 100 la respuesta es 422.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: q
          in: query
          required: false
          description: Texto del nombre o del código. Hasta 100 caracteres; `%`, `_` y `\` cuentan como texto.
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          required: false
          description: |
            `publicado` (completo y publicado; el que el sitio muestra) o `borrador`
            (todo lo demás).
          schema: { $ref: '#/components/schemas/EstadoTramitePanel' }
        - name: ordenar_por
          in: query
          required: false
          schema: { type: string, enum: [nombre, actualizado_en], default: actualizado_en }
        - name: direccion
          in: query
          required: false
          description: Por omisión `asc` para el nombre y `desc` para la fecha.
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TramitePanelCollection'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []
    post:
      tags: [Panel — Trámites]
      operationId: crearTramite
      summary: Crear un trámite (basta el nombre)
      description: |
        Requiere `tramites.gestionar`. Solo el nombre es obligatorio: el trámite nace como
        borrador. El código (`P0001`, `P0002`…) y la dirección (`slug`) los asigna el sistema
        y no cambian después. Pedir `publicado: true` en un trámite incompleto es 422 y el
        mensaje dice qué falta.
      x-status: implemented
      x-criterios: [RF-01-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TramiteInput' }
      responses:
        '201':
          description: Trámite creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TramitePanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

  /panel/tramites/{uuid}:
    get:
      tags: [Panel — Trámites]
      operationId: obtenerTramitePanel
      summary: Un trámite completo, con su estado y lo que le falta
      description: Requiere el permiso `tramites.gestionar`.
      x-status: implemented
      x-criterios: [RF-01-006]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El trámite
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TramitePanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
        - cookieSesion: []
    patch:
      tags: [Panel — Trámites]
      operationId: actualizarTramite
      summary: Editar un trámite
      description: |
        Requiere `tramites.gestionar`. Acepta cualquier subconjunto de campos; una lista que
        se envía reemplaza a la guardada (vacía, la borra). El código y la dirección no
        cambian. Editar un trámite del catálogo oficial (SUIT) lo marca como del panel: la
        carga automática deja de sobrescribirlo y la ficha pública lo declara en
        `procedencia.fuente` y en `origen_por_campo`. Un trámite publicado debe seguir
        completo; `publicado: false` lo retira del sitio.
      x-status: implemented
      x-criterios: [RF-01-006]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TramiteInput' }
      responses:
        '200':
          description: Trámite actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TramitePanelItem' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []
    delete:
      tags: [Panel — Trámites]
      operationId: eliminarTramite
      summary: Eliminar un trámite creado en el panel
      description: |
        Requiere `tramites.gestionar`. Solo se eliminan los trámites creados en el panel; los
        del catálogo oficial responden 409 (la carga automática los traería de vuelta) y se
        retiran del sitio con `PATCH` y `publicado: false`.
      x-status: implemented
      x-criterios: [RF-01-006]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Trámite eliminado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El trámite viene del catálogo oficial y no se puede eliminar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
      security:
        - cookieSesion: []

