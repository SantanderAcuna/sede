      security:
        - cookieSesion: []
    delete:
      tags: [Panel — Archivos]
      operationId: eliminarArchivo
      summary: Eliminar un archivo por su UUID
      description: Elimina el archivo físico de disco y su registro. Requiere autenticación.
      x-status: implemented
      x-criterios: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archivo eliminado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: Archivo no encontrado
      security:
        - cookieSesion: []

  # ══════════════════════════════════════════════════════════════════════════════
  # PANEL — TRANSPARENCIA (CRUD autenticado)
  # ══════════════════════════════════════════════════════════════════════════════
  /panel/transparencia/documentos:
    get:
      tags: [Panel — Transparencia]
      operationId: listarDocumentosPanel
      summary: Listado de documentos (incluye borradores)
      description: CRUD completo para administradores. RF-02-021.
      x-status: pending
      x-criterios: [RF-02-021]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [borrador, revision, publicado, despublicado, archivado]
        - name: autor_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Lista completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoCollection'
      security:
        - cookieSesion: []

    post:
      tags: [Panel — Transparencia]
      operationId: crearDocumento
      summary: Crear documento (multipart)
      x-status: pending
      x-criterios: [RF-02-021]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, titulo, subseccion_id, tipo_documento_id]
              properties:
                archivo: { type: string, format: binary }
                titulo: { type: string }
                descripcion: { type: string }
                subseccion_id: { type: integer }
                categoria_id: { type: integer }
                tipo_documento_id: { type: integer }
                fecha_publicacion: { type: string, format: date }
                periodicidad:
                  type: string
                  enum: [anual, semestral, trimestral, mensual, eventual]
                destacado: { type: boolean }
      responses:
        '201':
          description: Documento creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentoItem'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

  /panel/transparencia/documentos/{id}:
    patch:
      tags: [Panel — Transparencia]
      operationId: actualizarDocumento
      summary: Actualizar documento
      description: Actualiza documento, incluyendo reemplazo de archivo. RF-02-021.
      x-status: pending
      x-criterios: [RF-02-021]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: { type: string }
                descripcion: { type: string }
                estado:
                  type: string
                  enum: [borrador, revision, publicado, despublicado, archivado]
                fecha_publicacion: { type: string, format: date }
                motivo_cambio: { type: string }
      responses:
        '200':
          description: Documento actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentoItem'
        '422':
          $ref: '#/components/responses/ValidacionInvalida'
      security:
        - cookieSesion: []

    delete:
      tags: [Panel — Transparencia]
      operationId: eliminarDocumento
      summary: Soft-delete de documento
      x-status: pending
      x-criterios: [RF-02-021]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Eliminado (soft delete)
      security:
        - cookieSesion: []

  # ══════════════════════════════════════════════════════════════════════════════
  # PANEL — ALERTAS, ITA, AUDITORÍA
  # ══════════════════════════════════════════════════════════════════════════════
  /panel/alertas:
    get:
      tags: [Panel — Transparencia]
      operationId: listarAlertas
      summary: Alertas de vencimiento
      description: Alertas de publicaciones obligatorias. RF-02-022.
      x-status: pending
      x-criterios: [RF-02-022]
      responses:
        '200':
          description: Alertas activas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AlertaPublicacionItem' }
      security:
        - cookieSesion: []

  /panel/ita/tablero:
    get:
      tags: [Panel — ITA]
      operationId: obtenerTableroIta
      summary: Tablero ITA interno
      description: Porcentaje de cumplimiento del Índice de Transparencia. RF-02-029.
      x-status: pending
      x-criterios: [RF-02-029]
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TableroItaItem'
      security:
        - cookieSesion: []

  /panel/auditoria:
    get:
      tags: [Panel — Auditoría]
      operationId: listarAuditoria
      summary: Log de auditoría
      description: Registro de acciones de usuarios.
      x-status: pending
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema: { type: integer }
        - name: recurso
          in: query
          required: false
          schema: { type: string }
        - name: fecha_desde
          in: query
          required: false
          schema: { type: string, format: date }
        - name: fecha_hasta
          in: query
          required: false
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoriaCollection'
      security:
        - cookieSesion: []

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sesión de la SPA con cookie `HttpOnly`. Es el mecanismo del panel.
    portador:
      type: http
      scheme: bearer
      description: Token de API, para clientes que no son un navegador.

  parameters:
    Pagina:
      name: page
      in: query
      required: false
      description: Número de página, empezando en 1
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: per_page
      in: query
      required: false
      description: Elementos por página. Por encima de 100 la respuesta es 422.
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  responses:
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            no_encontrado:
              value:
                success: false
                message: "El recurso no fue encontrado."
                data: null
                errors: null

    ValidacionInvalida:
      description: La petición no cumple el contrato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            validacion:
              value:
                success: false
                message: "Error de validación."
                data: null
                errors:
                  per_page:
                    - "El campo per_page no puede ser mayor que 100."

    NoAutenticado:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            no_autenticado:
              value:
                success: false
                message: "No autenticado."
                data: null
                errors: null

    DemasiadasSolicitudes:
      description: Demasiadas solicitudes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          examples:
            rate_limit:
              value:
                success: false
                message: "Demasiadas solicitudes. Intenta más tarde."
                data: null
                errors: null

  # ══════════════════════════════════════════════════════════════════════════════
  # SCHEMAS
  # ══════════════════════════════════════════════════════════════════════════════
  schemas:
    PoliticaActo:
      type: object
      properties:
        tipo: { type: [string, 'null'], example: Resolución }
        numero: { type: [string, 'null'] }
        fecha: { type: [string, 'null'], format: date }

    PoliticaSeccion:
      type: object
      required: [id, titulo, parrafos]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]+$' }
        titulo: { type: string }
        parrafos:
          type: array
          items: { type: string }

    PoliticaResumen:
      type: object
      required: [id, type, slug, nombre, version, es_ejemplo]
      properties:
        id: { type: integer }
        type: { type: string, enum: [politica] }
        slug: { type: string }
        nombre: { type: string }
        version: { type: integer }
        vigente_desde: { type: [string, 'null'], format: date }
        acto: { $ref: '#/components/schemas/PoliticaActo' }
        es_ejemplo:
          type: boolean
          description: Verdadero mientras el texto sea de ejemplo, pendiente de aprobación por la Entidad.
        documento_oficial:
          description: >-
            Documento oficial adjunto desde el panel (acto administrativo o texto
            aprobado), guardado en la tabla común de archivos. `null` si no hay.
            Se descarga en la dirección estable `url`, relativa al sitio.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PoliticaDocumentoOficial'
        actualizada_en: { type: string, format: date }

    PoliticaDocumentoOficial:
      type: object
      required: [nombre, tipo, tamano, url]
      properties:
        nombre: { type: string }
        tipo: { type: string, description: Tipo MIME. }
        tamano: { type: integer, description: Bytes. }
        url: { type: string, example: /politicas/cookies/documento }

    PoliticaDocumento:
      allOf:
        - $ref: '#/components/schemas/PoliticaResumen'
        - type: object
          required: [secciones]
          properties:
            secciones:
              type: array
              items: { $ref: '#/components/schemas/PoliticaSeccion' }

    PoliticaPanelItem:
      allOf:
        - $ref: '#/components/schemas/PoliticaDocumento'
        - type: object
          required: [uuid, componentes, completa, problemas]
          properties:
            uuid:
              type: string
              format: uuid
              description: >-
                Identificador para adjuntar el documento oficial con
                `POST /panel/entidad/{modelUuid}/archivos` (colección `documento-oficial`).
            componentes:
              type: object
              description: Apartados mínimos exigidos, `id` → rótulo.
              additionalProperties: { type: string }
            completa: { type: boolean }
            problemas:
              type: array
              items: { type: string }

    PoliticaInput:
      type: object
      properties:
        nombre: { type: string, maxLength: 200 }
        version: { type: integer, minimum: 1, maximum: 65535 }
        vigente_desde: { type: [string, 'null'], format: date }
        acto_tipo: { type: [string, 'null'], maxLength: 60 }
        acto_numero: { type: [string, 'null'], maxLength: 60 }
        acto_fecha: { type: [string, 'null'], format: date }
        es_ejemplo: { type: boolean }
        secciones:
          type: array
          items: { $ref: '#/components/schemas/PoliticaSeccion' }


    # ─── Esquemas compartidos ───────────────────────────────────────────────
    ApiEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: [string, 'null'] }
        data: { type: [object, array, 'null'] }
        errors: { type: [object, 'null'] }

    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [meta, links]
          properties:
            data: { type: array }
            meta: { $ref: '#/components/schemas/PageMeta' }
            links: { $ref: '#/components/schemas/CollectionLinks' }

    PageMeta:
      type: object
      required: [current_page, from, last_page, path, per_page, to, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        from: { type: [integer, 'null'], minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        path: { type: string }
        per_page: { type: integer, minimum: 1 }
        to: { type: [integer, 'null'], minimum: 1 }
        total: { type: integer, minimum: 0 }

    CollectionLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }

    ApiError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: [object, 'null'] }

    # ─── Entidad ──────────────────────────────────────────────────────────
    EntidadItem:
      type: object
      required: [id, type, nombre]
      properties:
        id: { type: integer }
        type: { type: string, const: entidad }
        nombre: { type: string }
        sigla: { type: [string, 'null'] }
        nit: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        municipio: { type: [string, 'null'] }
        departamento: { type: [string, 'null'] }
        pais: { type: [string, 'null'] }
        telefono: { type: [string, 'null'] }
        linea_atencion: { type: [string, 'null'] }
        linea_gratuita: { type: [string, 'null'] }
        linea_anticorrupcion: { type: [string, 'null'] }
        correo_atencion: { type: [string, 'null'], format: email }
        correo_notificaciones_judiciales: { type: [string, 'null'], format: email }
        horario: { type: [string, 'null'] }
        codigo_postal: { type: [string, 'null'] }
        dominio: { type: [string, 'null'] }
        logo: { type: [string, 'null'] }
        redes:
          type: array
          items: { $ref: '#/components/schemas/EntidadRed' }
        politicas:
          type: array
          description: Las cinco políticas obligatorias que el pie debe enlazar.
          items: { $ref: '#/components/schemas/EntidadPolitica' }
        datos_por_confirmar:
          type: array
          description: |
            Campos que la entidad todavía no ha ratificado formalmente. Se publican
            como pendientes en lugar de inventarse.
          items: { type: string }

    FileMediaItem:
      type: object
      required: [uuid, filename, original_filename, mime_type, size, collection, url]
      properties:
        uuid: { type: string, format: uuid }
        model_uuid: { type: [string, 'null'], format: uuid }
        model_type: { type: string }
        model_id: { type: [integer, 'null'] }
        collection: { type: string }
        filename: { type: string }
        original_filename: { type: string }
        mime_type: { type: string }
        size: { type: integer, description: Tamaño en bytes }
        disk: { type: string }
        path: { type: string }
        url: { type: string, format: uri }
        metadata: { type: [object, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    EntidadRed:
      type: object
      required: [red, url]
      properties:
        red: { type: string, enum: [facebook, instagram, x, youtube, linkedin] }
        url: { type: string }

    EntidadPolitica:
      type: object
      required: [slug, nombre]
      properties:
        slug: { type: string }
        nombre: { type: string }
        actualizada_en: { type: [string, 'null'], format: date, readOnly: true }

    # ─── Entidad Input (Panel) ─────────────────────────────────────────────
    EntidadInput:
      type: object
      description: Datos para actualizar la entidad institucional desde el panel.
      properties:
        nombre: { type: string, maxLength: 200 }
        sigla: { type: [string, 'null'], maxLength: 20 }
        nit: { type: [string, 'null'], maxLength: 30 }
        direccion: { type: [string, 'null'], maxLength: 240 }
        municipio: { type: [string, 'null'], maxLength: 120 }
        departamento: { type: [string, 'null'], maxLength: 120 }
        pais: { type: [string, 'null'], maxLength: 80 }
        telefono: { type: [string, 'null'], maxLength: 40 }
        linea_atencion: { type: [string, 'null'], maxLength: 40 }
        linea_gratuita: { type: [string, 'null'], maxLength: 40 }
        linea_anticorrupcion: { type: [string, 'null'], maxLength: 40 }
        correo_atencion: { type: [string, 'null'], format: email, maxLength: 240 }
        correo_notificaciones_judiciales: { type: [string, 'null'], format: email, maxLength: 240 }
        horario: { type: [string, 'null'], maxLength: 240 }
        codigo_postal: { type: [string, 'null'], maxLength: 20 }
        dominio: { type: [string, 'null'], format: uri, maxLength: 240 }
        logo: { type: [string, 'null'], maxLength: 500 }
        redes:
          type: array
          description: Redes sociales de la entidad
          items:
            type: object
            required: [red, url]
            properties:
              red: { type: string, enum: [facebook, instagram, x, youtube, linkedin] }
              url: { type: string, format: uri }
        politicas:
          type: array
          description: Las cinco políticas obligatorias
          items:
            type: object
            required: [slug, nombre]
            properties:
              slug: { type: string, maxLength: 100 }
              nombre: { type: string, maxLength: 200 }
        datos_por_confirmar:
          type: array
          description: Lista de campos pendientes de ratificación
          items:
            type: string
            maxLength: 200

    # ─── TopBar y Footer ───────────────────────────────────────────────────
    TopBarItem:
      type: object
      required: [id, type]
      properties:
        id: { type: integer }
        type: { type: string, const: top-bar }
        logo_path: { type: [string, 'null'], format: uri }
        url_govco: { type: [string, 'null'], format: uri }
        altura_px: { type: integer }
        idioma_default: { type: string }

    FooterItem:
      type: object
      required: [id, type, nombre_autoridad]
      properties:
        id: { type: integer }
        type: { type: string, const: footer }
        nombre_autoridad: { type: string }
        nit: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        codigo_postal: { type: [string, 'null'] }
        municipio: { type: [string, 'null'] }
        departamento: { type: [string, 'null'] }
        horario: { type: [string, 'null'] }
        commutador: { type: [string, 'null'] }
        linea_anticorrupcion: { type: [string, 'null'] }
        correo_institucional: { type: [string, 'null'], format: email }
        correo_notificaciones: { type: [string, 'null'], format: email }
        redes:
          type: array
          items: { $ref: '#/components/schemas/EntidadRed' }
        politicas:
          type: array
          items: { $ref: '#/components/schemas/EntidadPolitica' }

    # ─── Menú ─────────────────────────────────────────────────────────────
    MenuItem:
      type: object
      required: [id, type, slug, etiqueta, orden, visible, tipo]
      properties:
        id: { type: integer }
        type: { type: string, const: menu-item }
        slug: { type: string }
        etiqueta: { type: string }
        ruta: { type: [string, 'null'] }
        descripcion: { type: [string, 'null'] }
        orden: { type: integer }
        visible: { type: boolean }
        tipo: { type: string, enum: [interno, externo, ancla, modal] }
        hijos:
          type: array
          description: Submenús (máximo 2 niveles)
          items: { $ref: '#/components/schemas/MenuItem' }

    # ─── Política ──────────────────────────────────────────────────────────
    PoliticaItem:
      type: object
      required: [id, type, codigo, nombre]
      properties:
        id: { type: integer }
        type: { type: string, const: politica }
        codigo:
          type: string
          enum: [terminos, privacidad, cookies, derechos-autor, accesibilidad]
        nombre: { type: string }
        contenido_html: { type: [string, 'null'] }
        tipo:
          type: string
          enum: [legal, seguridad, privacidad, institucional]
        vigente: { type: boolean }
        actualizada_en: { type: [string, 'null'], format: date, readOnly: true }

    # ─── Noticias ──────────────────────────────────────────────────────────
    NoticiaItem:
      type: object
      required: [id, type, slug, titulo, descripcion_corta, fecha_publicacion, destacada, imagen]
      properties:
        id: { type: integer }
        type: { type: string, const: noticias }
        slug: { type: string }
        titulo: { type: string, maxLength: 150 }
        descripcion_corta: { type: string, maxLength: 200 }
        fecha_publicacion: { type: string, format: date-time }
        destacada: { type: boolean }
        imagen:
          description: Nula si la noticia no tiene imagen (una publicada siempre la tiene).
          oneOf:
            - type: 'null'
            - type: object
              required: [url, alt]
              properties:
                url:
                  type: string
                  description: |
                    En el sitio, la ruta pública (`/api/v1/noticias/{slug}/imagen`, sólo
                    publicadas). En las respuestas del panel, la del panel
                    (`/api/v1/panel/noticias/{uuid}/imagen`), que también sirve borradores.
                  example: /api/v1/noticias/inauguracion-del-parque/imagen
                alt:
                  type: [string, 'null']
                  description: Texto alternativo; obligatorio en una noticia publicada.
        contenido:
          type: string
          description: |
            Cuerpo en HTML saneado (lista blanca: h2, h3, p, br, strong, em, ul, ol, li,
            blockquote, a con https/http/mailto/tel, e img propias con `alt`). Se sanea al
            guardar y de nuevo al entregarlo; una noticia antigua en texto plano se entrega
            como párrafos `<p>`. Sólo en el detalle.

    EstadoNoticia:
      type: string
      enum: [borrador, programada, publicada]
      description: |
        Lo decide el servidor con su reloj. `borrador`: sin marcar como publicada, no se
        ve en el sitio sea cual sea la fecha. `programada`: publicada, pero su fecha aún
        no llega. `publicada`: publicada y con la fecha cumplida.

    NoticiaPanelItem:
      allOf:
        - $ref: '#/components/schemas/NoticiaItem'
        - type: object
          required: [uuid, activo, estado, completa, problemas]
          properties:
            uuid: { type: string, format: uuid }
            activo: { type: boolean, description: Marcada como publicada. }
            estado: { $ref: '#/components/schemas/EstadoNoticia' }
            completa: { type: boolean }
            problemas:
              type: array
              items: { type: string }

    NoticiaInput:
      type: object
      properties:
        titulo: { type: string, maxLength: 150 }
        descripcion_corta: { type: string, maxLength: 200 }
        contenido:
          type: string
          maxLength: 100000
          description: |
            HTML del editor o texto plano (párrafos separados por una línea en blanco). Se
            sanea en el servidor al guardar: lo que no esté en la lista blanca se descarta.
        fecha_publicacion: { type: string, format: date-time }
        destacada: { type: boolean }
        activo: { type: boolean }
        imagen_alt:
          type: string
          maxLength: 250
          description: Cambia el texto alternativo de la imagen ya subida (sólo en PATCH).

    NoticiaCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/NoticiaItem' }

    NoticiaPanelCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/NoticiaPanelItem' }

    EstadoTramitePanel:
      type: string
      enum: [publicado, borrador]

    TramitePanelItem:
      allOf:
        - $ref: '#/components/schemas/TramiteItem'
        - type: object
          required: [uuid, codigo, estado, origen, modificado_en_panel, completo, problemas]
          properties:
            uuid: { type: string, format: uuid }
            codigo: { type: string, maxLength: 20 }
            estado: { $ref: '#/components/schemas/EstadoTramitePanel' }
            origen:
              type: string
              enum: [panel, fuente]
              description: "`panel` si se creó aquí (se puede eliminar); `fuente` si viene del catálogo oficial, se haya corregido o no (solo se despublica)."
            modificado_en_panel:
              type: boolean
              description: Un trámite del catálogo oficial que se corrigió aquí; la carga automática ya no lo sobrescribe.
            completo: { type: boolean }
            problemas:
              type: array
              description: Lo que falta para poder publicarlo, en español.
              items: { type: string }

    TramitePanelFila:
      type: object
      required: [id, uuid, type, codigo, slug, nombre, estado, origen, modificado_en_panel, completo, problemas]
      properties:
        id: { type: integer }
        uuid: { type: string, format: uuid }
        type: { type: string, const: tramites }
        codigo: { type: string }
        slug: { type: string }
        nombre: { type: string }
        modalidad: { type: [string, 'null'], enum: [en_linea, parcialmente_en_linea, presencial, null] }
        estado: { $ref: '#/components/schemas/EstadoTramitePanel' }
        origen: { type: string, enum: [panel, fuente] }
        modificado_en_panel: { type: boolean }
        completo: { type: boolean }
        problemas:
          type: array
          items: { type: string }
        publicado_en: { type: [string, 'null'], format: date-time }
        actualizado_en: { type: [string, 'null'], format: date-time }

    EstadoUsuarioPanel:
      type: string
      enum: [activo, inactivo, bloqueado, pendiente]

    UsuarioPanelItem:
      type: object
      required: [uuid, name, email, estado, roles, es_super_admin]
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [usuarios] }
        name: { type: string }
        email: { type: string, format: email }
        estado: { $ref: '#/components/schemas/EstadoUsuarioPanel' }
        mfa_habilitado: { type: boolean }
        roles: { type: array, items: { type: string } }
        es_super_admin: { type: boolean }
        creado_en: { type: [string, 'null'], format: date-time }

    UsuarioPanelCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/UsuarioPanelItem' }

    UsuarioPanelCrear:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true, description: "Con letras y números. Nunca se devuelve." }
        estado: { $ref: '#/components/schemas/EstadoUsuarioPanel' }
        roles: { type: array, items: { type: string } }

    UsuarioPanelCambio:
      type: object
      description: Cualquier subconjunto de campos; solo viaja lo que cambia.
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        estado: { $ref: '#/components/schemas/EstadoUsuarioPanel' }
        roles: { type: array, items: { type: string } }

    RolPanelItem:
      type: object
      required: [id, name, permisos, usuarios, protegido]
      properties:
        id: { type: integer }
        type: { type: string, enum: [roles] }
        name: { type: string }
        permisos: { type: array, items: { type: string } }
        usuarios: { type: integer, description: Cuántos usuarios tienen el rol. }
        protegido: { type: boolean, description: "`true` para super-admin: no se edita ni se elimina." }

    RolPanelEntrada:
      type: object
      properties:
        name: { type: string, minLength: 3, maxLength: 60, description: "Letras, números, espacios y guiones." }
        permisos: { type: array, items: { type: string } }

    GrupoPermisosPanel:
      type: object
      required: [grupo, permisos]
      properties:
        grupo: { type: string }
        permisos:
          type: array
          items:
            type: object
            required: [nombre, etiqueta, descripcion]
            properties:
              nombre: { type: string }
              etiqueta: { type: string }
              descripcion: { type: string }

    BannerPublico:
      type: object
      required: [uuid, titulo, imagen]
      properties:
        uuid: { type: string, format: uuid }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        enlace: { type: [string, 'null'], description: Ruta del sitio o dirección https. }
        imagen:
          type: object
          required: [url, alt]
          properties:
            url: { type: string }
            alt: { type: string }

    EstadoBanner:
      type: string
      enum: [borrador, programado, vigente, vencido]

    BannerPanelItem:
      type: object
      required: [uuid, titulo, orden, activo, estado, problemas]
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [banners] }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        enlace: { type: [string, 'null'] }
        orden: { type: integer }
        activo: { type: boolean }
        estado: { $ref: '#/components/schemas/EstadoBanner' }
        vigente_desde: { type: [string, 'null'], format: date-time }
        vigente_hasta: { type: [string, 'null'], format: date-time }
        imagen:
          type: [object, 'null']
          properties:
            url: { type: string }
            alt: { type: [string, 'null'] }
        problemas: { type: array, items: { type: string } }
        actualizado_en: { type: [string, 'null'], format: date-time }

    BannerEntrada:
      type: object
      properties:
        titulo: { type: string, minLength: 1, maxLength: 80 }
        descripcion: { type: [string, 'null'], maxLength: 200 }
        enlace: { type: [string, 'null'], maxLength: 500, description: "Ruta del sitio (/transparencia) o dirección https://." }
        activo: { type: boolean }
        vigente_desde: { type: [string, 'null'], format: date-time }
        vigente_hasta: { type: [string, 'null'], format: date-time }
        imagen_alt: { type: [string, 'null'], maxLength: 250 }

    TramitePanelCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TramitePanelFila' }

    TramiteInput:
      type: object
      description: |
        Datos de un trámite. En `POST` solo `nombre` es obligatorio. Los campos de las
        listas (`requisitos`, `documentos`, `momentos`, `audiencias`, `perfiles`,
        `medios_resultado`, `puntos_atencion`, `normativa`, `cuentas`,
        `canales_consulta_estado`) tienen la misma forma que en `TramiteItem`; `slug` y
        `codigo` se ignoran.
      properties:
        nombre: { type: string, minLength: 3, maxLength: 200 }
        resumen: { type: [string, 'null'], maxLength: 500 }
        url_ficha_gov_co: { type: [string, 'null'], format: uri, maxLength: 500 }
        modalidad: { type: [string, 'null'], enum: [en_linea, parcialmente_en_linea, presencial, null] }
        tiene_costo: { type: [string, 'null'], enum: [gratuito, con_costo, null] }
        tiempo_solucion_dias: { type: [integer, 'null'], minimum: 0, maximum: 36500 }
        canal_inicio: { type: [string, 'null'], enum: [propio, portal_nacional, null] }
        url_inicio: { type: [string, 'null'], format: uri, maxLength: 500 }
        url_manual_tramite_en_linea: { type: [string, 'null'], format: uri, maxLength: 500 }
        consulta_estado: { type: [string, 'null'], maxLength: 500 }
        resultado: { type: [string, 'null'], maxLength: 2000 }
        producto_final: { type: [string, 'null'], maxLength: 500 }
        observaciones_resultado: { type: [string, 'null'], maxLength: 2000 }
        fecha_cualquiera: { type: [boolean, 'null'] }
        cuando_se_puede_realizar: { type: [string, 'null'], maxLength: 1000 }
        url_calendario: { type: [string, 'null'], format: uri, maxLength: 500 }
        palabras_relacionadas: { type: [string, 'null'], maxLength: 1000 }
        publicado: { type: boolean, description: "`true` publica (exige ficha completa); `false` retira del sitio." }
        costo: { type: [object, 'null'], additionalProperties: true }
        categoria:
          type: [object, 'null']
          properties:
            slug: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 120 }
            nombre: { type: string, maxLength: 160 }
        requisitos: { type: array, items: { type: object, additionalProperties: true }, maxItems: 100 }
        documentos: { type: array, items: { type: object, additionalProperties: true }, maxItems: 100 }
        momentos: { type: array, items: { type: object, additionalProperties: true }, maxItems: 30 }
        audiencias: { type: array, items: { type: object, additionalProperties: true }, maxItems: 50 }
        perfiles: { type: array, items: { type: string, maxLength: 60 }, maxItems: 30 }
        medios_resultado: { type: array, items: { type: string, maxLength: 60 }, maxItems: 30 }
        puntos_atencion: { type: array, items: { type: object, additionalProperties: true }, maxItems: 50 }
        normativa: { type: array, items: { type: object, additionalProperties: true }, maxItems: 100 }
        cuentas: { type: array, items: { type: object, additionalProperties: true }, maxItems: 20 }
        canales_consulta_estado: { type: array, items: { type: object, additionalProperties: true }, maxItems: 20 }
        seguimiento: { type: [object, 'null'], additionalProperties: true }

    # ─── Subsección Transparencia ──────────────────────────────────────────
    SubseccionTransparenciaItem:
      type: object
      required: [id, type, codigo, nombre, orden]
      properties:
        id: { type: integer }
        type: { type: string, const: subseccion-transparencia }
        codigo:
          type: string
          enum: [informacion-entidad, normativa, contratacion, planeacion, tramites, participa, datos-abiertos, grupos-interes, reporte-especifico, tributaria]
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        orden: { type: integer, minimum: 1, maximum: 10 }
        numero_ley: { type: integer, minimum: 1, maximum: 10 }
        url: { type: [string, 'null'], format: uri }

    # ─── Documentos ────────────────────────────────────────────────────────
    DocumentoItem:
      type: object
      required: [id, type, slug, titulo, estado]
      properties:
        id: { type: integer }
        type: { type: string, const: documento }
        slug: { type: string }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        fecha_publicacion: { type: [string, 'null'], format: date }
        fecha_documento: { type: [string, 'null'], format: date }
        periodicidad:
          type: [string, 'null']
          enum: [anual, semestral, trimestral, mensual, eventual, null]
        estado:
          type: string
          enum: [borrador, revision, publicado, despublicado, archivado]
        destacado: { type: boolean }
        indice_lecturabilidad: { type: [number, 'null'] }
        hash_sha256: { type: [string, 'null'] }
        tamano_bytes: { type: [integer, 'null'] }
        formato_abierto: { type: boolean }
        subseccion: { $ref: '#/components/schemas/SubseccionTransparenciaItem' }
        categoria: { type: [object, 'null'] }
        tipo_documento: { type: [object, 'null'] }
        archivo_url: { type: [string, 'null'], format: uri }
        autor:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
        metadatos:
          type: array
          items: { $ref: '#/components/schemas/MetadatoItem' }
        versiones:
          type: array
          items: { $ref: '#/components/schemas/DocumentoVersionItem' }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    MetadatoItem:
      type: object
      required: [id, type, clave, valor]
      properties:
        id: { type: integer }
        type: { type: string, const: metadato }
        clave: { type: string }
        valor: { type: string }

    DocumentoVersionItem:
      type: object
      required: [id, version, fecha]
      properties:
        id: { type: integer }
        version: { type: string }
        fecha: { type: string, format: date-time }
        hash_sha256: { type: string }
        url: { type: string, format: uri }

    DocumentoCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentoItem' }

    # ─── Servidor Público ─────────────────────────────────────────────────
    ServidorPublicoItem:
      type: object
      required: [id, type, nombres, apellidos, cargo]
      properties:
        id: { type: integer }
        type: { type: string, const: servidor-publico }
        codigo_sigep: { type: [string, 'null'] }
        nombres: { type: string }
        apellidos: { type: string }
        cargo: { type: string }
        correo_institucional: { type: [string, 'null'], format: email }
        extension: { type: [string, 'null'] }
        dependencia:
          type: object
          properties:
            id: { type: integer }
            codigo: { type: string }
            nombre: { type: string }

    # ─── Calendario Tributario ─────────────────────────────────────────────
    CalendarioTributarioItem:
      type: object
      required: [id, type, impuesto, vigencia, fecha_vencimiento]
      properties:
        id: { type: integer }
        type: { type: string, const: calendario-tributario }
        impuesto:
          type: string
          enum: [predial, ica, otros]
        vigencia: { type: integer }
        fecha_vencimiento: { type: string, format: date }
        descripcion: { type: [string, 'null'] }
        aplica_a: { type: [string, 'null'] }

    # ─── Búsqueda ──────────────────────────────────────────────────────────
    SugerenciaBusquedaItem:
      type: object
      required: [id, type, titulo, categoria, tipo_recurso, url]
      properties:
        id:
          type: integer
          description: Identificador dentro de su `tipo_recurso`; la pareja (tipo_recurso, id) es única
        type: { type: string, const: sugerencias-busqueda }
        titulo: { type: string }
        categoria:
          type: string
          description: Rótulo para el ciudadano («Trámite», «Política»)
        tipo_recurso:
          type: string
          enum: [tramite, politica]
          description: |
            Se amplía cuando existan más contenidos (noticias: T-23). Añadir un valor
            es un cambio del contrato: los clientes generados tienen que regenerarse.
        url:
          type: string
          format: uri-reference
          description: Ruta dentro del sitio, sin dominio
        score:
          type: number
          minimum: 0
          description: Pertinencia (mayor es más pertinente); sólo sirve para comparar dentro de una respuesta

    ResultadoBusquedaItem:
      type: object
      required: [id, type, titulo, categoria, tipo_recurso, extracto, fecha, autor, miniatura, url]
      properties:
        id: { type: integer }
        type: { type: string, const: resultados-busqueda }
        titulo: { type: string }
        categoria: { type: string }
        tipo_recurso:
          type: string
          enum: [tramite, politica]
        extracto:
          type: [string, 'null']
          description: Principio del texto del contenido, recortado sin partir palabras
        fecha:
          type: [string, 'null']
          format: date
          description: |
            Trámite: fecha en que la sede lo publicó (`publicado_en`), **no** la de su ficha
            oficial en GOV.CO ni la de su última actualización en la fuente. Política: inicio
            de su vigencia.
        autor:
          type: [string, 'null']
          description: Siempre `null` hoy; ningún contenido registra autor
        miniatura:
          type: [string, 'null']
          format: uri-reference
          description: Siempre `null` hoy; ningún contenido tiene imagen propia
        url: { type: string, format: uri-reference }
        score: { type: number, minimum: 0 }

    ResultadoBusquedaCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ResultadoBusquedaItem' }

    BusquedaResult:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentoItem' }
            meta:
              type: object
              required: [total, termino]
              properties:
                total: { type: integer }
                termino: { type: string }
                tiempo_ms: { type: integer }

    # ─── Alertas ───────────────────────────────────────────────────────────
    AlertaPublicacionItem:
      type: object
      required: [id, type, tipo, mensaje, dias_anticipacion]
      properties:
        id: { type: integer }
        type: { type: string, const: alerta-publicacion }
        tipo:
          type: string
          enum: [plan-accion-31ene, informe-gestion-31ene, pqrsd-trimestral, control-interno-semestral, calendario-tributario]
        mensaje: { type: string }
        dias_anticipacion: { type: integer }
        activa: { type: boolean }
        vence_en: { type: [string, 'null'], format: date }

    # ─── Tablero ITA ──────────────────────────────────────────────────────
    TableroItaItem:
      type: object
      required: [id, type, porcentaje_cumplimiento]
      properties:
        id: { type: integer }
        type: { type: string, const: tablero-ita }
        porcentaje_cumplimiento: { type: number, minimum: 0, maximum: 100 }
        items_cumplen: { type: integer }
        items_no_cumplen: { type: integer }
        items_parcial: { type: integer }
        items_no_aplica: { type: integer }
        ultima_actualizacion: { type: string, format: date-time, readOnly: true }

    # ─── Auditoría ────────────────────────────────────────────────────────
    AuditoriaItem:
      type: object
      required: [id, type, accion, recurso, created_at]
      properties:
        id: { type: integer }
        type: { type: string, const: auditoria }
        accion:
          type: string
          enum: [crear, actualizar, eliminar, login, logout]
        recurso: { type: string }
        recurso_id: { type: [integer, 'null'] }
        cambios: { type: [object, 'null'] }
        ip_origen: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        usuario:
          type: object
          properties:
            id: { type: integer }
            email: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }

    AuditoriaCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditoriaItem' }

    # ─── Usuario ──────────────────────────────────────────────────────────
    UsuarioItem:
      type: object
      required: [id, type, email, estado]
      properties:
        id: { type: integer }
        type: { type: string, const: usuario }
        email: { type: string, format: email }
        mfa_habilitado: { type: boolean }
        estado:
          type: string
          enum: [activo, inactivo, bloqueado, pendiente]
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string, const: rol }
              nombre: { type: string }
              permisos:
                type: array
                items: { type: string }

    # ─── Trámites (completo) ───────────────────────────────────────────────
    TramiteItem:
      type: object
      required:
        - id
        - type
        - slug
        - nombre
        - modalidad
        - tiene_costo
        - costo
        - tiempo_solucion_dias
        - canal_inicio
        - consulta_estado
        - requisitos
        - url_ficha_gov_co
      properties:
        id: { type: integer }
        type: { type: string, const: tramites }
        slug: { type: string }
        nombre: { type: string }
        resumen: { type: [string, 'null'] }
        url_ficha_gov_co: { type: string, format: uri }
        procedencia: { $ref: '#/components/schemas/TramiteProcedencia' }
        modalidad:
          type: string
          enum: [en_linea, parcialmente_en_linea, presencial]
        tiene_costo:
          type: string
          enum: [gratuito, con_costo]
        costo:
          $ref: '#/components/schemas/TramiteCosto'
        tiempo_solucion_dias: { type: integer, minimum: 0 }
        canal_inicio:
          type: string
          enum: [propio, portal_nacional]
        url_inicio: { type: [string, 'null'] }
        url_manual_tramite_en_linea: { type: [string, 'null'], format: uri, maxLength: 500 }
        consulta_estado: { type: string }
        requisitos:
          type: array
          items: { $ref: '#/components/schemas/TramiteRequisito' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/TramiteDocumento' }
        # Momentos del trámite: los pasos oficiales del visor de SUIT
        # (Reunir documentos, Radicar la documentación, etc.) con sus
        # requisitos dentro. Cada momento es narrativo, no un ítem de
        # checklist, y conserva el orden oficial.
        momentos:
          type: array
          items: { $ref: '#/components/schemas/TramiteMomento' }
        # Resultado y medios por los que se entrega (correo, presencial, etc.)
        resultado: { type: [string, 'null'] }
        producto_final: { type: [string, 'null'], maxLength: 500 }
        # La aclaración que el visor publica bajo el resultado: de qué depende
        # el plazo. Nula cuando la fuente no la declara (107 de 123 trámites).
        observaciones_resultado: { type: [string, 'null'] }
        # «¿Cuándo se puede realizar?». El visor lo responde con tres hechos y
        # no con una frase: el booleano que cubre casi todos los trámites, la
        # condición en prosa de unos pocos y el calendario externo de uno.
        fecha_cualquiera: { type: [boolean, 'null'] }
        cuando_se_puede_realizar: { type: [string, 'null'] }
        url_calendario: { type: [string, 'null'], maxLength: 500 }
        medios_resultado:
          type: array
          items: { type: string, maxLength: 60 }
        # Palabras clave secundarias del visor, separadas por comas.
        palabras_relacionadas: { type: [string, 'null'] }
        # Audiencias (perfiles) declaradas por el visor, con descripción.
        audiencias:
          type: array
          items: { $ref: '#/components/schemas/TramiteAudiencia' }
        perfiles:
          type: array
          items: { type: string, maxLength: 60 }
        puntos_atencion:
          type: array
          items: { $ref: '#/components/schemas/TramitePuntoAtencion' }
        normativa:
          type: array
          items: { $ref: '#/components/schemas/TramiteNorma' }
        # Cuentas de recaudo declaradas por el visor. Distintas de
        # `costo.cuentas` porque el visor las publica a nivel de trámite
        # (no a nivel de requisito de pago), y porque su forma es la del
        # visor: `banco`/`tipo`/`numero`/`titular` en vez de
        # `entidad`/`tipo_cuenta`/`numero_cuenta`/`titular`.
        cuentas:
          type: array
          items: { $ref: '#/components/schemas/TramiteCuentaVisor' }
        canales_consulta_estado:
          type: array
          items: { $ref: '#/components/schemas/TramiteCanalConsulta' }
        # Bloque de seguimiento del visor: teléfono, email, presencial, web.
        # Cada sub-bloque puede traer varios registros.
        seguimiento: { $ref: '#/components/schemas/TramiteSeguimiento' }
        categoria:
          oneOf:
            - $ref: '#/components/schemas/TramiteCategoria'
            - type: 'null'
        pasos:
          type: array
          items: { $ref: '#/components/schemas/TramitePaso' }
        publicado_en: { type: [string, 'null'], format: date-time, readOnly: true }
        actualizado_en: { type: [string, 'null'], format: date-time, readOnly: true }

    TramiteCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TramiteItem' }

    TramiteCategoria:
      type: object
      required: [slug, nombre]
      properties:
        slug: { type: string }
        nombre: { type: string }

    TramiteRequisito:
      type: object
      required: [tipo, descripcion]
      properties:
        tipo:
          type: string
          enum: [documento, verificacion_institucional, solicitud, formulario, pago]
        descripcion: { type: string, maxLength: 500 }
        obligatorio: { type: boolean, default: true }
        cantidad: { type: [integer, 'null'], minimum: 0 }
        unidad_cantidad: { type: [string, 'null'], maxLength: 40 }
        nota: { type: [string, 'null'], maxLength: 500 }
        canal: { type: [string, 'null'], enum: [web, presencial, correo, telefonico, null] }
        url: { type: [string, 'null'], format: uri }
        correo: { type: [string, 'null'], format: email }
        # Campos adicionales del visor de SUIT (opcional). En el listado
        # de `requisitos[]` (que es una mezcla de los momentos) la Sede
        # aplana el requisito del momento y conserva su `documento`,
        # `formulario`, `pago[]` y `cuentas[]` cuando los trae.
        orden: { type: [integer, 'null'], minimum: 1 }
        tipos_audiencia:
          type: array
          items:
            type: string
            enum: [Ciudadano, Extranjeros, Organizaciones, "Instituciones o dependencias públicas"]
        documento: { type: [string, 'null'] }
        formulario: { type: [string, 'null'] }
        formulario_url: { type: [string, 'null'], format: uri }
        url_pago: { type: [string, 'null'], format: uri }
        pago:
          type: array
          items: { $ref: '#/components/schemas/TramitePagoValor' }
        cuentas:
          type: array
          items: { $ref: '#/components/schemas/TramiteCuentaVisor' }

    TramiteCosto:
      type: object
      required: [tiene_costo]
      properties:
        tiene_costo: { type: string, enum: [gratuito, con_costo] }
        tipo_valor:
          type: [string, 'null']
          enum: [fijo, smlv, avaluo_liquidacion, rango, null]
        valor:
          type: [string, 'null']
          maxLength: 30
        moneda: { type: [string, 'null'], maxLength: 20 }
        url_pago: { type: [string, 'null'], format: uri }
        descripcion: { type: [string, 'null'], maxLength: 1000 }
        cuentas:
          type: array
          items: { $ref: '#/components/schemas/TramiteCuentaBancaria' }

    TramiteCuentaBancaria:
      type: object
      required: [entidad, numero_cuenta]
      properties:
        entidad: { type: string, maxLength: 120 }
        tipo_cuenta: { type: [string, 'null'], maxLength: 40 }
        titular: { type: [string, 'null'], maxLength: 120 }
        numero_cuenta: { type: string, maxLength: 40 }
        codigo_recaudo: { type: [string, 'null'], maxLength: 40 }

    TramitePuntoAtencion:
      type: object
      required: [nombre, direccion]
      properties:
        nombre: { type: string, maxLength: 160 }
        direccion: { type: string, maxLength: 240 }
        horario: { type: [string, 'null'], maxLength: 240 }
        telefono: { type: [string, 'null'], maxLength: 40 }
        municipio: { type: [string, 'null'], maxLength: 120 }
        departamento: { type: [string, 'null'], maxLength: 120 }
        latitud: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitud: { type: [number, 'null'], minimum: -180, maximum: 180 }

    TramiteNorma:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, maxLength: 120 }
        numero: { type: [string, 'null'], maxLength: 40 }
        anio: { type: [integer, 'null'], minimum: 1800, maximum: 2200 }
        articulos: { type: [string, 'null'], maxLength: 240 }
        url: { type: [string, 'null'], format: uri }
        url_descarga: { type: [string, 'null'], format: uri }

    TramiteCanalConsulta:
      type: object
      required: [canal, habilitado]
      properties:
        canal:
          type: string
          enum: [sede, presencial, telefonico, web, correo, otro]
        habilitado:
          type: boolean
        nombre: { type: [string, 'null'], maxLength: 160 }
        url: { type: [string, 'null'] }
        correo: { type: [string, 'null'], format: email }
        telefono: { type: [string, 'null'], maxLength: 40 }
        horario: { type: [string, 'null'], maxLength: 240 }

    TramiteDocumento:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        url: { type: [string, 'null'] }
        formato: { type: [string, 'null'] }

    TramitePaso:
      type: object
      required: [orden, titulo]
      properties:
        orden: { type: integer, minimum: 1 }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }

    TramiteMomento:
      type: object
      required: [orden, titulo]
      description: |
        Un momento del trámite, en la forma en que los publica el visor de
        SUIT. Es un paso narrativo con un orden oficial y un conjunto de
        requisitos dentro. La Sede lo renderiza como una línea de tiempo.
      properties:
        orden: { type: integer, minimum: 1 }
        titulo: { type: string, maxLength: 200 }
        descripcion: { type: [string, 'null'] }
        requisitos:
          type: array
          items: { $ref: '#/components/schemas/TramiteRequisitoVisor' }

    TramiteRequisitoVisor:
      type: object
      description: |
        Requisito de un momento, en la forma del visor de SUIT. Tiene los
        mismos cinco tipos del contrato (`documento`, `pago`, `solicitud`,
        `verificacion_institucional`, `formulario`) y campos opcionales según
        el tipo: cuentas de recaudo si es `pago`, formulario con URL si es
        `formulario`, etc.

        `tipos_audiencia` declara para qué tipo de persona aplica el
        requisito y es la base del filtro «Para realizarlo necesita» del
        visor: el ciudadano se reconoce en uno de los grupos (Ciudadano,
        Extranjeros, Organizaciones) y la Sede filtra los requisitos que
        aplican. Si el campo viene vacío, el requisito se considera
        universal y aparece en todos los grupos.
      required: [tipo]
      properties:
        orden: { type: [integer, 'null'], minimum: 1 }
        tipo:
          type: string
          enum: [documento, verificacion_institucional, solicitud, formulario, pago]
        descripcion: { type: [string, 'null'] }
        obligatorio: { type: [boolean, 'null'], default: true }
        tipos_audiencia:
          type: array
          items:
            type: string
            enum: [Ciudadano, Extranjeros, Organizaciones, "Instituciones o dependencias públicas"]
        # Documento
        documento: { type: [string, 'null'] }
        # Formulario
        formulario: { type: [string, 'null'] }
        formulario_url: { type: [string, 'null'], format: uri }
        # Pago
        url_pago: { type: [string, 'null'], format: uri }
        pago:
          type: array
          items: { $ref: '#/components/schemas/TramitePagoValor' }
        cuentas:
          type: array
          items: { $ref: '#/components/schemas/TramiteCuentaVisor' }
        # Canales
        canales:
          type: array
          items: { $ref: '#/components/schemas/TramiteCanalRequisito' }

    TramitePagoValor:
      type: object
      required: []
      description: |
        El valor declarado para un pago, en la forma del visor. Distintos
        campos pueden venir nulos según el `tipo_valor`: `fijo` requiere
        `valor`, `avaluo_liquidacion` lo deja nulo con una explicación.
      properties:
        valor: { type: [string, 'null'], maxLength: 30 }
        moneda: { type: [string, 'null'], maxLength: 20 }
        tipo_valor:
          type: [string, 'null']
          enum: [fijo, smlv, avaluo_liquidacion, rango, null]
        descripcion: { type: [string, 'null'] }

    TramiteCuentaVisor:
      type: object
      required: [numero]
      description: |
        Una cuenta bancaria declarada por el visor de SUIT, en su forma
        original. Distinta de `TramiteCuentaBancaria` (que es la forma del
        contrato) sólo en los nombres de los campos: el visor usa
        `banco`/`numero` en vez de `entidad`/`numero_cuenta`.
      properties:
        banco: { type: [string, 'null'], maxLength: 120 }
        tipo: { type: [string, 'null'], maxLength: 40 }
        numero: { type: string, maxLength: 40 }
        titular: { type: [string, 'null'], maxLength: 120 }

    TramiteAudiencia:
      type: object
      required: [nombre]
      description: |
        Una audiencia del visor: el grupo (Ciudadano, Organizaciones, etc.)
        y el nombre (Infancia, Juventud, etc.). El grupo se publica en el
        objeto padre y aquí sólo va el nombre y la descripción.
      properties:
        grupo: { type: [string, 'null'], maxLength: 60 }
        nombre: { type: string, maxLength: 120 }
        descripcion: { type: [string, 'null'] }

    TramiteSeguimiento:
      type: object
      description: |
        Los canales de seguimiento que el visor publica. Cada bloque es
        opcional: un trámite puede tener teléfono pero no email, etc. Los
        canales los dibuja la ficha con `habilitado: false` mientras el
        expediente electrónico de la Sede no esté construido.
      properties:
        telefono:
          type: array
          items:
            type: object
            properties:
              numero: { type: [string, 'null'] }
              extension: { type: [string, 'null'] }
              horario: { type: [string, 'null'] }
        email:
          type: array
          items:
            type: object
            properties:
              email: { type: [string, 'null'], format: email }
        presencial:
          type: array
          items: { $ref: '#/components/schemas/TramitePuntoAtencion' }
        web:
          type: array
          items:
            type: object
            properties:
              url: { type: [string, 'null'], format: uri }

    TramiteCanalRequisito:
      type: object
      required: [tipo]
      description: |
        El canal por el que se presenta un requisito (correo, presencial,
        web). En la ficha, el tipo se renderiza como un enlace o un
        distintivo.
      properties:
        tipo:
          type: string
          enum: [correo, presencial, web, telefonico]
        email: { type: [string, 'null'], format: email }
        url: { type: [string, 'null'], format: uri }

    TramiteProcedencia:
      type: object
      required: [fuente, obtenido_en]
      properties:
        fuente: { type: string, maxLength: 120 }
        url: { type: [string, 'null'], format: uri }
        obtenido_en: { type: string, format: date }
        nota: { type: [string, 'null'], maxLength: 500 }
        api: { type: [string, 'null'] }
        origen_por_campo:
          type: object
          additionalProperties:
            type: string
            enum: [fuente, derivado, entidad, ausente]
        derivados:
          type: array
          items: { $ref: '#/components/schemas/TramiteDerivacion' }
        faltantes:
          type: array
          items: { type: string, maxLength: 60 }

    TramiteDerivacion:
      type: object
      required: [campo, regla]
      properties:
        campo: { type: string, maxLength: 60 }
        regla: { type: string, maxLength: 500 }
