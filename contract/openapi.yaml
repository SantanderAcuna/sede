          required: false
          schema:
            type: string
            enum: [borrador, revision, publicado, despublicado, archivado]
        - name: autor_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Lista completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoCollection'
