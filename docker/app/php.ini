; Configuración de PHP para producción.
;
; La regla que gobierna este archivo: lo que el ciudadano ve nunca revela cómo
; está construida la sede.

expose_php = Off

; Los errores se registran, jamás se muestran.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Memoria por petición. El número de procesos de FPM se calcula a partir de este
; valor y del límite de memoria del contenedor: ver la sección 15.3 del plan.
memory_limit = 128M

; Subidas.
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
max_input_time = 60

; Opcache: el intérprete no vuelve a compilar lo que ya compiló.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; El código vive en la imagen y no cambia en caliente: no hay nada que validar.
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Sesiones y subidas fuera del código, en el sistema de archivos efímero.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; Zona horaria de la entidad.
date.timezone = America/Bogota

; Cabecera de identificación, para correlacionar con el punto de entrada.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
