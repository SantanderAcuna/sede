# Punto de entrada de la Sede Electrónica.
#
# Un solo dominio con tres superficies, tal como exige el artículo 14 del
# Decreto Ley 2106 de 2019: una sola sede por autoridad, un solo origen, un solo
# certificado y un solo lugar donde se aplican las cabeceras.
#
#   /           → sitio público, con renderizado en servidor
#   /admin      → SPA del panel, servida desde disco
#   /api/v1     → API de la aplicación
#
# El nombre del anfitrión se resuelve por variable para que el mismo artefacto
# sirva en pruebas y en producción.

upstream aplicacion {
    server app:9000;
    keepalive 16;
}

upstream sitio_ssr {
    server sitio:3000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Puerto 80 — sólo el desafío del certificado y la redirección
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # El desafío de renovación tiene que poder atenderse sin TLS: el certificado
    # todavía no existe cuando se pide.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Todo lo demás va a HTTPS, de forma permanente y conservando la ruta.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Puerto 443 — la sede
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificado del origen. Lo emite y renueva `deploy/droplet/certificado.sh`
    # y vive en un volumen que el contenedor monta en sólo lectura.
    ssl_certificate     /etc/nginx/certs/sede.crt;
    ssl_certificate_key /etc/nginx/certs/sede.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # Sin reutilización de sesión entre clientes distintos: es una sede
    # electrónica, no una tienda.
    ssl_session_cache off;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/snippets/seguridad.conf;

    # La raíz tiene que ser el DIRECTORIO PADRE de la carpeta del panel, no la
    # carpeta misma.
    #
    # Con `root /usr/share/nginx/admin`, una petición a `/admin/index.html` se
    # resuelve contra `/usr/share/nginx/admin/admin/index.html`, que no existe;
    # `try_files` cae en su propio respaldo, que vuelve a entrar por el mismo
    # sitio, y nginx responde 500 con «rewrite or internal redirection cycle».
    # Se veía como un error del panel y era un nivel de ruta de más.
    root /usr/share/nginx;
    index index.html;

    # --- Sitio público, con renderizado en servidor -------------------------
    location / {
        limit_req  zone=sitio burst=50 nodelay;
        limit_conn conexiones 20;

        proxy_pass http://sitio_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # El HTML no se cachea: el contenido cambia y una portada obsoleta en una
        # sede electrónica es información incorrecta.
        proxy_buffering on;
        proxy_cache off;
    }

    # --- Panel: SPA servida desde disco -------------------------------------
    # La ruta del panel cambió de `/panel` a `/admin`. La anterior REDIRIGE en vez
    # de caer en el sitio público: sin esta regla la atendía el comodín de Nuxt,
    # así que una dirección del panel acababa sirviendo la portada del sitio, con
    # estado 200 y sin que nada indicara que el panel ya no está ahí.
    #
    # Redirección permanente y con el resto de la ruta: `/panel/algo` → `/admin/algo`,
    # para no romper los enlaces que ya existan.
    location /panel {
        rewrite ^/panel(.*)$ /admin$1 permanent;
    }

    location /admin {
        limit_req zone=sitio burst=30 nodelay;

        # Cualquier ruta del panel devuelve su documento: el enrutado lo resuelve
        # el navegador, no el servidor.
        try_files $uri $uri/ /admin/index.html;
    }

    # Los activos llevan el contenido en el nombre, así que son inmutables.
    location ~* ^/admin/assets/.*\.(js|css|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # --- API ----------------------------------------------------------------
    location /api/v1 {
        limit_req  zone=api burst=20 delay=5;
        limit_conn conexiones 10;

        include /etc/nginx/snippets/fastcgi.conf;
    }

    # Inicio de sesión: mucho más despacio que el resto de la API. El límite de
    # tasa es la primera defensa contra la fuerza bruta; el bloqueo por cuenta
    # lo aplica la propia aplicación.
    location /api/v1/auth/ {
        limit_req zone=acceso burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi.conf;
    }

    # Documentos servidos con URL firmada.
    location /storage/ {
        include /etc/nginx/snippets/fastcgi.conf;
    }

    # --- Sondas -------------------------------------------------------------
    # Vida: pública y con cuerpo mínimo. La usan la comprobación externa y el
    # orquestador. Que responda no dice nada del interior.
    location = /health {
        access_log off;
        include /etc/nginx/snippets/fastcgi.conf;
    }

    # Preparación: sólo desde la red interna. Su cuerpo enumera los componentes
    # y su estado, y eso no se publica.
    location = /ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        include /etc/nginx/snippets/fastcgi.conf;
    }

    # --- Lo que no se sirve nunca -------------------------------------------
    # Archivos ocultos, respaldos, metadatos de control de versiones y
    # configuración. Cada uno es una fuga de información.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|ini|log|sql|bak|old|orig|save|swp|dist|conf|yml|yaml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|phpstan\.neon|pint\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Archivos inexistentes: sin listado de directorio.
    location ~ /\.well-known/ {
        root /var/www/certbot;
    }

    autoindex off;
}
