# Canal interno: el servidor del sitio consulta la API por aquí, con la dirección del visitante.
#
# **Por qué existe.** Mientras el sitio consultaba la API por la URL pública, la petición salía a
# Internet, volvía por Cloudflare y la API la veía llegar desde la dirección del servidor del
# sitio, no desde la del visitante. Todos los visitantes compartían entonces UN solo cupo de
# peticiones (el de `throttle:api`, 60 por minuto, y el de `limit_req`): medido en staging con dos
# equipos distintos, uno recibía el error en el mismo segundo en que el otro cruzaba el umbral.
#
# **Cómo funciona.** El sitio llama a `http://nginx:8080/api/v1/...` por la red interna y manda la
# dirección que nginx ya restauró para el visitante (`X-Sede-Cliente-Ip`). Aquí, y sólo aquí, esa
# cabecera se toma como la dirección del cliente, así que el límite de nginx, el de Laravel y el
# registro cuentan al visitante y no al servidor del sitio.
#
# **La confianza.** Se acepta la cabecera de CUALQUIER origen porque este puerto NO se publica:
# `compose.yaml` sólo publica el 80 y el 443 (una guarda de CI lo comprueba) y el puerto 8080 sólo
# es alcanzable desde la red interna. Si alguna vez se publicara, cualquiera podría falsear su
# dirección y saltarse los límites: por eso la guarda existe. Si falta la cabecera o no es una
# dirección, nginx conserva la del servidor del sitio: el fallo es compartir cupo, nunca falsear.
#
# **El anfitrión.** El `fetch` de Node ignora una cabecera `Host` que se le pida cambiar (medido),
# así que la petición llega con `Host: nginx:8080`. El sitio manda además el anfitrión público en
# `X-Forwarded-Host` (nginx ya lo pone en el 443) y aquí se le pasa a PHP como `Host`, para que
# cualquier enlace absoluto que genere la API (paginación, archivos) apunte al dominio público y
# no a `nginx:8080`. Sólo se acepta si tiene forma de nombre de anfitrión; si no, se deja el `Host`
# recibido.
map $http_x_forwarded_host $anfitrion_interno {
    default $http_host;
    "~^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$" $http_x_forwarded_host;
}

# Sólo atiende la API. Todo lo demás es 404.
server {
    listen 8080;
    server_name _;

    real_ip_header X-Sede-Cliente-Ip;
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;

    location /api/v1 {
        limit_req  zone=api burst=20 delay=5;
        limit_conn conexiones 10;

        include /etc/nginx/snippets/fastcgi.conf;
        fastcgi_param HTTP_HOST $anfitrion_interno;
    }

    location / {
        return 404;
    }
}
