# Punto de entrada de la Sede Electrónica.
#
# Zonas de límite de tasa: van aquí, en el contexto `http`, y NO dentro de un
# server block. Es un error que la configuración de referencia cometía y que
# impide que nginx arranque.

user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

error_log  /dev/stderr warn;

events {
    worker_connections  1024;
    multi_accept        off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Lo que el ciudadano escribe en el buscador NO se registra (T-22, AC-22.7).
    #
    # La consulta viaja en la URL (`/buscar?q=…`, `/api/v1/busqueda/sugerencias?q=…`,
    # `/api/v1/tramites?buscar=…`) y puede contener datos personales —un número de
    # documento, un nombre—. El registro de acceso la guardaría por cada petición, y
    # los registros se conservan, se copian y se leen por más gente que la base de
    # datos. Por eso, si la cadena de consulta trae el parámetro `q` o `buscar`, el
    # registro lleva sólo la ruta, tanto en la línea de petición como en el `Referer`
    # (el navegador lo envía con la URL completa de la página de resultados en cada
    # recurso que esa página pide).
    #
    # Se decide por el parámetro y no por la ruta: así también cubre `//api/…`,
    # rutas futuras y la página de resultados. El resto de las URL conserva su cadena
    # de consulta, útil para operar (`?page=2`, `?per_page=20`).
    #
    # Límites que esto NO cierra, declarados en `docs/busqueda.md` §R3: el
    # `error_log` de nginx (si una petición falla aguas arriba, copia la línea de
    # petición) y el registro de Cloudflare. Los informes de la política de contenido
    # (`csp_informe`) sí se tratan: ver más abajo.
    map $request_uri $uri_registrable {
        default $request_uri;
        ~^(?<ruta_sin_consulta>[^?]*)\?(?:.*&)?(?:q|buscar)=.*$ $ruta_sin_consulta;
    }

    map $http_referer $referer_registrable {
        default $http_referer;
        ~^(?<origen_sin_consulta>[^?]*)\?(?:.*&)?(?:q|buscar)=.*$ $origen_sin_consulta;
    }

    # El registro va a la salida estándar: lo recoge el sistema de contenedores.
    # No se escribe a archivo dentro del contenedor, que es efímero. La línea de
    # petición se reconstruye con `$uri_registrable` en vez de `$request`.
    log_format principal '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri_registrable $server_protocol" '
                         '$status $body_bytes_sent "$referer_registrable" '
                         '"$http_user_agent" cf=$http_cf_connecting_ip '
                         'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout principal;

    # Avisos de la política de contenido (T-08). Una línea por informe, con el
    # cuerpo escapado como JSON para que un navegador hostil no pueda inyectar
    # líneas falsas en el registro.
    #
    # El informe trae la URL del documento (`document-uri`, `referrer`): si la violación
    # ocurrió en `/buscar?q=…`, el informe lleva la consulta del ciudadano (T-22,
    # AC-22.7). nginx no puede reescribir un JSON, así que cuando el cuerpo contiene un
    # parámetro `q` o `buscar` se registra un aviso en su lugar. Se pierde el detalle de
    # ese informe, no el hecho de que ocurrió. (`\x5cu0026` es `\u0026`, el `&` escapado.)
    map $request_body $informe_registrable {
        default $request_body;
        ~*(?:[?&]|\x5cu0026)(?:q|buscar)= "[omitido: el informe trae la consulta del buscador]";
    }

    log_format csp_informe escape=json '{"tipo":"csp-informe","hora":"$time_iso8601",'
                                       '"ip":"$remote_addr","agente":"$http_user_agent",'
                                       '"informe":"$informe_registrable"}';

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  30;

    # Tiempos acotados: una conexión que se queda a medias no puede ocupar un
    # proceso indefinidamente. Es la defensa contra el ataque de conexiones
    # lentas.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    reset_timedout_connection on;

    large_client_header_buffers 4 8k;
    server_names_hash_bucket_size 128;

    # Tamaño máximo de cuerpo: un formulario con anexos no debe poder agotar el
    # disco del servidor. 25 MB = post_max_size de PHP; el archivo en sí tiene 20 MB
    # (upload_max_filesize y SubirArchivoRequest). Ver docker/app/php.ini.
    client_max_body_size 25m;

    # Compresión sólo donde aporta: los activos ya comprimidos no se tocan.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # --- Límites de tasa -----------------------------------------------------
    # La primera línea de defensa propia, detrás de Cloudflare.

    # Por IP y por ruta: la API es lo que hay que proteger.
    limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;
    # El inicio de sesión va mucho más despacio.
    limit_req_zone $binary_remote_addr zone=acceso:10m rate=1r/s;
    # El sitio público tolera más.
    limit_req_zone $binary_remote_addr zone=sitio:10m  rate=20r/s;
    # Conexiones simultáneas por IP.
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # --- Conjuntos de confianza ---------------------------------------------
    # El punto de entrada sólo debe creer sus propias cabeceras de reenvío.
    # Los rangos de Cloudflare se mantienen en el archivo de IP real.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    include /etc/nginx/conf.d/*.conf;
}
