# Bloque PHP-FPM de la API.
#
# `try_files $uri =404` antes de pasar a PHP es la defensa contra un archivo
# subido que se convierta en ejecutable: si la ruta no corresponde a un archivo
# real del punto de entrada, no llega nunca al intérprete.

location ~ ^/api/v1/(index\.php|.*)$ {
    limit_req  zone=api burst=20 delay=5;
    limit_conn conexiones 10;

    include /etc/nginx/snippets/fastcgi.conf;
}

location = /index.php {
    include /etc/nginx/snippets/fastcgi.conf;
}
