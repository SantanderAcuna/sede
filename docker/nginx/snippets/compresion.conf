# Compresión sólo donde aporta: los activos ya comprimidos no se tocan.
#
# Nivel 5 (M01-4). nginx comprime por defecto a nivel 1. Mientras el HTML pasaba por la
# recompresión del borde de Cloudflare eso no importaba; con `Cache-Control: no-transform`
# (ver sin-transformar.conf) el borde ya no recomprime y sale tal cual lo deja nginx.
# Medido con el HTML real de la portada compilada (64,8 KB): nivel 1 = 15,1 KB; nivel 5 =
# 12,9 KB; zstd -3 = 14,0 KB; brotli -q5 = 12,2 KB. El nivel 5 recupera lo perdido sin el
# coste de CPU de los niveles altos (el HTML es lo único que se comprime en cada petición).
gzip on;
gzip_comp_level 5;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml image/svg+xml;
