# Content-Security-Policy en modo INFORME (T-08, H-09).
#
# `Report-Only`: el navegador comprueba la política y avisa de lo que habría
# bloqueado, pero NO bloquea nada. Es la fase de observación: una política mal
# ajustada rompe el sitio, y la forma de ajustarla sin romperlo es medirla antes.
# Los avisos llegan a `/csp-informes` (ver default.conf) y quedan en el registro.
#
# Va solo en las respuestas que son DOCUMENTOS —el sitio con renderizado en
# servidor y el panel—; la API ya emite la suya (`default-src 'self'`) desde
# `CabecerasDeSeguridad`. Un `add_header` dentro de un `location` anula los del
# servidor, por eso quien incluye este archivo incluye también `seguridad.conf`.
#
# Qué dice cada directiva, y qué se espera ver en los informes:
#
#   default-src 'self'    Todo lo demás, solo de este origen.
#   script-src 'self'     SIN 'unsafe-inline' y SIN 'unsafe-eval'. Medido en staging
#                         con un navegador real (2026-10-28), las violaciones son:
#                           · Sitio (Nuxt): el `importmap` en línea y el script
#                             `window.__NUXT__.config=…`. Cada uno cambia con la
#                             compilación; se resolverán con nonce (p. ej. el módulo
#                             nuxt-security), no con 'unsafe-inline'. El bloque
#                             `application/json` de datos NO es ejecutable y no cuenta.
#                           · Sitio y panel (Cloudflare): un script en línea
#                             (`window.__CF$cv$params`, detecciones de JavaScript)
#                             cuyo contenido cambia en cada petición, así que no se
#                             puede fijar con un hash. Depende de la configuración de
#                             Cloudflare, no del código.
#                           · Sitio y panel (Cloudflare): `beacon.min.js` de
#                             analítica, ver más abajo.
#                         El panel no tiene scripts en línea propios.
#   style-src 'self' 'unsafe-inline'
#                         'unsafe-inline' SOLO en estilos: Vue y Nuxt escriben
#                         atributos `style` y CSS crítico en línea, y un estilo en
#                         línea no ejecuta código. Es la excepción documentada.
#   img-src / font-src    'self' y data: (iconos y fuentes incrustados).
#   connect-src 'self'    El sitio y el panel hablan con su propia API.
#   object-src 'none', base-uri 'self', form-action 'self', frame-ancestors 'none'
#                         Sin plugins, sin <base> ajeno, formularios solo hacia
#                         aquí y nadie puede enmarcar la sede.
#
# El script de analítica de Cloudflare NO está permitido a propósito: la decisión
# D-5 es cargarlo solo tras consentimiento (T-26). Mientras se inyecte, aparecerá
# como violación, que es lo correcto.
#
# Paso a modo de aplicación (AC-08.3): cuando 7 días de informes salgan limpios,
# esta misma política se emite como `Content-Security-Policy` en lugar de
# `...-Report-Only`.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /csp-informes" always;
