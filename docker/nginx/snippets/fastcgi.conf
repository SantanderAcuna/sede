# Pasar una petición a PHP-FPM.
#
# Punto importante: nginx y la aplicación viven en contenedores distintos, así
# que la ruta del guion tiene que ser la de DENTRO del contenedor de la
# aplicación, no la que ve nginx. Por eso no se usa `try_files`: comprobaría la
# existencia de un archivo que no está en su propio sistema de archivos y
# devolvería 404 siempre.
#
# Todas las peticiones entran por el controlador frontal y la ruta original
# viaja en REQUEST_URI, que ya envía `fastcgi_params`.

fastcgi_pass  app:9000;

include fastcgi_params;

fastcgi_param SCRIPT_FILENAME /app/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param DOCUMENT_ROOT   /app/public;

# Esquema y puerto originales: sin esto la aplicación genera enlaces con `http`
# y el ciudadano acaba en una redirección que no espera.
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
fastcgi_param HTTPS on;

# La dirección real, ya restaurada por el archivo de rangos de Cloudflare.
fastcgi_param REMOTE_ADDR $remote_addr;

fastcgi_read_timeout 60s;
fastcgi_buffering on;
