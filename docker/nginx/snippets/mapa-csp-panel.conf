# CSP del panel. Va en el contexto `http` (lo incluye nginx.conf).
#
# La política de `csp-informe.conf` es una sola para el sitio y el panel. Lo único que difiere es
# `img-src`: la vista previa de la imagen que se elige en el panel antes de subirla es una dirección
# `blob:` (URL.createObjectURL). Permitirla en el sitio público relajaría su política sin necesidad,
# así que se añade solo cuando la ruta es la del panel (`location /admin`, que es un prefijo: por
# eso la expresión es `^/admin` y no `^/admin/`).
#
# `$uri` ya está normalizada por nginx (sin `//`, sin `..`) y es la misma con la que se elige el
# `location`, incluido el respaldo `try_files … /admin/index.html` de las rutas profundas del panel.
# El valor lleva el espacio inicial: vacío no añade nada a la directiva.
map $uri $csp_img_src_extra {
    default    "";
    ~^/admin   " blob:";
}
