# M01-4 (RF-01-017, CA-01-017). Va en el contexto `http` (lo incluye nginx.conf).
#
# Decide, por tipo de contenido, si la respuesta lleva `Cache-Control: no-transform`.
# Sólo el HTML: es lo único donde el borde de Cloudflare puede inyectar su baliza de
# Web Analytics (antes del consentimiento, y la sede no la pone: el consentimiento
# la gobierna el plugin `analitica.client.ts`). Un valor vacío hace que `add_header`
# no emita nada, así que los activos y la API conservan sus propias cabeceras.
#
# `$sent_http_content_type` funciona igual para lo que viene del sitio (proxy) y para
# lo que sirve nginx desde disco (el panel).
map $sent_http_content_type $cabecera_sin_transformar {
    default       "";
    ~*^text/html  "no-transform";
}
