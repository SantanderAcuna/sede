# Cabeceras de seguridad.
#
# Se aplican por superficie y no de una vez para todo: la API no necesita la
# misma política de contenido que el sitio, y enviar la del sitio a la API sería
# abrirla sin motivo.
#
# `always` hace que se envíen también en las respuestas de error: un 404 sin
# cabeceras es una página sin cabeceras.

# HSTS — dos años, con submundos y precarga. Es el valor que exige el expediente
# y el que hace elegible la precarga.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# El auditor de XSS de los navegadores está retirado y puede introducir
# problemas. Se desactiva explícitamente.
add_header X-XSS-Protection "0" always;

# Public-Key-Pins NO se envía: fue retirada de los navegadores por riesgo de
# denegación de servicio, y el propio expediente lo reconoce. Su ausencia es
# deliberada y está documentada.
