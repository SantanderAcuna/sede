# M01-4: el HTML sale con `Cache-Control: no-transform` (ver mapa-sin-transformar.conf).
#
# Según la documentación de Cloudflare ("Origin Cache Control"), una respuesta con ese
# valor no se modifica en el borde: no se le añade la baliza de Web Analytics. Efectos
# colaterales documentados, también del borde: no se recomprime el cuerpo (se sirve con la
# compresión del origen, gzip) y no se transforma el contenido (p. ej. la ofuscación de
# correos). Se incluye en los dos `location` que sirven documentos HTML (sitio y panel);
# un `add_header` dentro de un `location` anula los del servidor, por eso va aquí y no arriba.
add_header Cache-Control $cabecera_sin_transformar always;
