# Configuración de PostgreSQL para la sede.
#
# Dimensionada al límite del contenedor (2 GB), no a la memoria del servidor:
# un `shared_buffers` calculado sobre la memoria total es la forma clásica de
# que la base se coma la máquina.

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
max_connections = 100

# Registro: lo justo para poder reconstruir un incidente.
logging_collector = off
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on

# La conexión exige cifrado. Dentro de la red interna el tráfico ya viaja
# aislado, pero esto impide que una mala configuración lo degrade en silencio.
ssl = off

# Nada de confiar en el sistema de nombres para autenticar.
