<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <!-- El icono de la entidad: el escudo sobre el azul institucional.
         Las rutas parten de `%BASE_URL%` (Vite lo reemplaza por `/admin/`): ni una ruta
         absoluta `/favicon.ico`, que apuntaría a la raíz del sitio público, ni una
         relativa `./favicon.ico`, que desde `/admin/contenidos/noticias` pedía
         `/admin/contenidos/favicon.ico` y recibía HTML. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%icono-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cobalto del Kit (RNF-B3-045), el mismo que `tokens.css` y el manifiesto.
         Antes declaraba otro azul, que no es el cobalto institucional. -->
    <meta name="theme-color" content="#0943B5" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Un solo nombre de producto (D-47), idéntico al `TITULO_BASE` del
         enrutador: la pestaña no puede cambiar de nombre al navegar. -->
    <title>SGDI · Alcaldía Distrital de Santa Marta</title>
    <!-- Cache busting: fuerza al navegador a recargar si tiene versiones
         cacheadas del bundle antiguo (con iconos en kebab-case). Sin este
         mecanismo, el cache HTTP del navegador podía servir versiones
         obsoletas durante horas. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts?t=20261006"></script>
  </body>
</html>
